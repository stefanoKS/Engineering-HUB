      if (event.key === 'Enter') {
        event.preventDefault();
        if (searchTimer) window.clearTimeout(searchTimer);
        loadPortfolio(dom.search.value.trim());
      }
    });
    [dom.filterStatus, dom.filterResponsibility, dom.filterCategory, dom.filterOwner, dom.filterRisk].forEach(function (select) {
      select.addEventListener('change', syncFilterState);
    });
    dom.filterDue.addEventListener('click', function () {
      state.filters.dueSoon = !state.filters.dueSoon;
      dom.filterDue.setAttribute('aria-pressed', state.filters.dueSoon ? 'true' : 'false');
      renderProjects();
    });
    dom.reset.addEventListener('click', resetFilters);
    dom.retry.addEventListener('click', function () { loadPortfolio(state.query); });

    dom.list.addEventListener('click', function (event) {
      var trigger = event.target.closest('[data-project-id]');
      if (!trigger) return;
      openProject(trigger.getAttribute('data-project-id'));
    });

    dom.detailGroups.addEventListener('click', function (event) {
      var trigger = event.target.closest('[data-open-task]');
      if (!trigger) return;
      openTask(state.currentProjectId, trigger.getAttribute('data-open-task'));
    });

    dom.detailBack.addEventListener('click', closeDetail);
    dom.drawerClose.addEventListener('click', closeDrawer);
    dom.backdrop.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function (event) {
      if ((event.key === 'Escape' || event.key === 'Esc') && !state.drawerOpen && !dom.detail.hidden) closeDetail();
    });

    // V1.7 worker view.
    if (dom.viewPortfolio) dom.viewPortfolio.addEventListener('click', function () { setView('portfolio'); });
    if (dom.viewWorkers) dom.viewWorkers.addEventListener('click', function () { setView('workers'); });
    function workerFilter(key, control) {
      if (!control) return;
      control.addEventListener('change', function () {
        state.worker[key] = control.value;
        state.worker.offset = 0;
        loadWorkers();
      });
    }
    workerFilter('worker', dom.workerWorker);
    workerFilter('responsibilityId', dom.workerResponsibility);
    workerFilter('projectId', dom.workerProject);
    workerFilter('group', dom.workerGroup);
    workerFilter('priority', dom.workerPriority);
    function workerToggle(key, control) {
      if (!control) return;
      control.addEventListener('click', function () {
        state.worker[key] = !state.worker[key];
        control.setAttribute('aria-pressed', state.worker[key] ? 'true' : 'false');
        state.worker.offset = 0;
        loadWorkers();
      });
    }
    workerToggle('overdue', dom.workerOverdue);
    workerToggle('dueWithin', dom.workerDue);
    if (dom.workerSearch) {
      var workerTimer = null;
      dom.workerSearch.addEventListener('input', function () {
        if (workerTimer) window.clearTimeout(workerTimer);
        workerTimer = window.setTimeout(function () {
          state.worker.query = dom.workerSearch.value.trim();
          state.worker.offset = 0;
          loadWorkers();
        }, SEARCH_DEBOUNCE_MS);
      });
    }
    if (dom.workerPrev) dom.workerPrev.addEventListener('click', function () {
      state.worker.offset = Math.max(0, state.worker.offset - 20); loadWorkers();
    });
    if (dom.workerNext) dom.workerNext.addEventListener('click', function () {
      state.worker.offset += 20; loadWorkers();
    });
    if (dom.workerRetry) dom.workerRetry.addEventListener('click', loadWorkers);
  }

  function boot() {
    wireLanguage();
    wireEvents();
    // The stored preference is applied to the static markup before the first render.
    I18n.apply(language, document);
    renderLanguageButtons();
    renderSync();
    // Receipts survive a reload; an interrupted send is reported honestly, never as success.
    loadSubmissions();
    renderActivity();
    setView('portfolio');
    // Request availability fails closed: nothing is offered until the server confirms it.
    state.requestConfig = {enabled: false, state: 'loading'};
    api.requestConfig().then(function (result) {
      var enabled = !!(result && result.ok && result.data && result.data.enabled === true);
      state.requestConfig = {enabled: enabled, state: enabled ? 'enabled' : 'disabled'};
      refreshDrawer();
    }).catch(function () {
      state.requestConfig = {enabled: false, state: 'error'};
      refreshDrawer();
    });
    loadPortfolio('');
  }

  boot();
})();
</script>
