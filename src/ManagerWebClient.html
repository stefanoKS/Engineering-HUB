<script>

function pump() { while (running < 2 && queue.length) { running++; queue.shift()(); } }
function rpc(write, operation, payload) {

    queue.push(function () {

}
var api = {
  read: function (operation, payload, fresh) {

    if (!fresh && found && Date.now() - found.at < 30000) return Promise.resolve(found.data);
    return rpc(false, operation, payload).then(function (data) { if (epoch === generation) cache.set(key, {at: Date.now(), data: data}); return data; });
  },
  write: function (operation, payload) {
    var key = payload.taskId || payload.projectId || payload.subprojectId || payload.memberId || payload.responsibilityId || payload.requestId || operation;
    if (pending.has(key)) return Promise.reject(new Error(t('saving')));

  }
};
window.ManagerWebClient = {api: api, metrics: metrics, drafts: drafts};
function rowValues(parent, pairs) { var dl = el('dl'); pairs.forEach(function (pair) { dl.append(el('dt', pair[0]), el('dd', pair[1] === '' || pair[1] === undefined ? '—' : pair[1])); }); parent.appendChild(dl); }

function field(parent, key, value, options, onChange, type) {

  control.name = key;
  control.addEventListener('change', function () { onChange(type === 'checkbox' ? control.checked : control.value); });

function listFilters(kind, host) {

function metaItem(parent, label, value, valueClass) { var item = el('div', undefined, 'meta-item'); item.append(el('span', label, 'meta-label'), el('span', value === '' || value === undefined ? '—' : value, 'meta-value' + (valueClass ? ' ' + valueClass : ''))); parent.appendChild(item); }
function healthClass(value) { return value === 'RED' ? 'pill-red' : value === 'YELLOW' ? 'pill-amber' : value === 'GREEN' ? 'pill-green' : 'pill-gray'; }
/** Accessible progress bar: the percentage stays visible text, never colour alone. */
function progressRow(percent, name, parent) {
  var row = el('div', undefined, 'progress-row');
  if (typeof percent !== 'number') { row.appendChild(el('span', t('progressUnavailable'), 'progress-value')); parent.appendChild(row); return; }
  var value = Math.max(0, Math.min(100, percent)), bar = el('div', undefined, 'progress'), fill = el('div', undefined, 'progress-fill');

  bar.setAttribute('aria-valuenow', String(Math.round(value))); bar.setAttribute('aria-label', t('projectProgressAria', {name: name}));

}
function deadlineText(p) {

  if (p.deadlineKind === 'closed') return '';

}
function projectCards(data, host) {

    if(!data.requests.length)host.appendChild(el('p',t('empty')));
    data.requests.forEach(function(r){var card=el('article',undefined,'card');card.appendChild(el('h2',r.taskName));rowValues(card,[[t('project'),r.projectName],[t('member'),r.requesterName],[t('deadline'),r.currentDeadline+' → '+r.requestedDeadline],[t('difference'),r.differenceDays],[t('reason'),r.reason],[t('description'),r.explanation||r.completionNote],[t('statusField'),r.status]]);if(['PENDING','STALE','PROCESSING'].indexOf(r.status)<0){rowValues(card,[[t('note'),r.decisionNote],[t('member'),r.reviewer]]);host.appendChild(card);return;}var draftKey='request:'+r.requestId, draft=drafts.get(draftKey)||{};drafts.set(draftKey,draft);field(card,'note',draft.note||'',null,function(v){draft.note=v;},'textarea');['approve','reject','return'].forEach(function(a){button(a,function(){act('requestDecide',{requestId:r.requestId,action:a.toUpperCase(),note:draft.note||'',confirmation:'DECIDE REQUEST'},true).then(function(ok){if(ok)drafts.delete(draftKey);});},card);});host.appendChild(card);});
    host.appendChild(el('h2',t('history')));(data.history||[]).forEach(function(h){var item=el('article',undefined,'card');rowValues(item,[[t('task'),h.taskId],[t('deadline'),h.previousDeadline+' → '+h.newDeadline],[t('reason'),h.reason],[t('member'),h.changedBy]]);host.appendChild(item);});

function renderAutomation(data,host) {

    var control=field(box,k,Array.isArray(value)?value.join(','):value,k==='EMAIL_MODE'?['OFF','PREVIEW','LIVE']:null,function(v){draft.values[k]=v;draft.dirty=true;},type);control.disabled=actorRole!=='ADMIN';});
  if(actorRole==='ADMIN') {field(form,'confirmation',draft.confirmation||'',null,function(v){draft.confirmation=v;});var save=el('button',t('settingsSave'));save.type='submit';form.appendChild(save);form.addEventListener('submit',function(e){e.preventDefault();if(!window.confirm(t('confirm')))return;var changes={};keys.forEach(function(k){if(JSON.stringify(draft.values[k])!==JSON.stringify(draft.base[k]))changes[k]=draft.values[k];});save.disabled=true;api.write('automationSave',{changes:changes,confirmation:draft.confirmation||'',confirmed:true,revision:draft.revision}).then(function(){drafts.delete('automation');load(true,t('saved'));}).catch(function(e){notice(e.message,'error');}).finally(function(){save.disabled=false;});});}

function structured(value,host) { if(value && typeof value==='object'){var dl=el('dl');Object.keys(value).forEach(function(k){dl.appendChild(el('dt',EH_I18N.has('web.'+k)?t(k):k));var dd=el('dd');structured(value[k],dd);dl.appendChild(dd);});host.appendChild(dl);}else host.appendChild(el('span',value===null?'—':String(value))); }
function act(action,payload,confirm) {

  return api.write(action,payload).then(function(result){load(true,result&&result.status==='STALE'?t('requestStale'):t('saved'));return !(result&&result.status==='STALE');}).catch(function(e){notice(e.message,'error');return false;});
}
// One create/edit form per record type. Field mapping sends partial patches only.
var schemas={
 project:{id:'Project_ID',key:'projectId',create:'projectCreate',save:'projectSave',fields:{name:'Project_Name',description:'Description',responsibilityId:'Responsibility_ID',ownerId:'Project_Owner_ID',deadline:'Committed_Deadline',statusField:'Status',category:'Category',priority:'Priority',summary:'Dashboard_Summary',visibility:'Dashboard_Visibility'}},

function openEditor(type,id,record,defaults) {
  var seq=++drawerSequence, key=type+':'+(id||'new'), old=drafts.get(key);notice(t('loading'));
  var fetch=record?Promise.resolve(record):id?api.read(type,{id:id},true).then(function(d){var r=d.record;r._confirmations=d.confirmations||[];return r;}):Promise.resolve({});
  Promise.all([fetch,api.read('references')]).then(function(results){if(seq!==drawerSequence)return;references=results[1];var schema=schemas[type];if(!old){old={type:type,id:id,original:results[0],values:{},base:{},subprojects:[]};Object.keys(schema.fields).forEach(function(k){old.values[k]=results[0][schema.fields[k]]===undefined?'':results[0][schema.fields[k]];});if(!id){Object.assign(old.values,{priority:'Medium',statusField:type==='project'?'Planned':'Assigned',visibility:'RESTRICTED',durationUnit:'DAY',durationBasis:'WORKING_DAYS',enabled:true,role:'MEMBER'},defaults||{});}old.base=Object.assign({},old.values);drafts.set(key,old);}currentEditor={key:key,draft:old};renderEditor();byId('editor').showModal();notice('');if(old.values.projectId)loadSubprojects(old.values.projectId,old);if(type==='skillAssess')api.read('skills').then(function(d){old.skills=d.items;renderEditor();});}).catch(function(e){notice(e.message,'error');});
}
function loadSubprojects(projectId,draft){var seq=(draft.subSequence||0)+1;draft.subSequence=seq;api.read('project',{id:projectId}).then(function(d){if(draft.subSequence!==seq)return;draft.subprojects=d.subprojects;if(currentEditor&&currentEditor.draft===draft)renderEditor();}).catch(function(e){notice(e.message,'error');});}
function renderEditor() {
  if(!currentEditor)return;var d=currentEditor.draft,schema=schemas[d.type],host=byId('formHost');host.replaceChildren();byId('editorTitle').textContent=t(d.type)+' · '+t(d.id?'edit':'new');
  var form=el('form'), fields=el('div',undefined,'fields'), message=el('div');message.setAttribute('role','status');form.append(fields,message);if(d.type==='task'&&d.id){rowValues(form,[[t('taskApprove'),d.original.Assignment_Approved_At||'—'],[t('plannedStart'),d.original.Planned_Start||'—'],[t('scheduleState'),(d.original._confirmations||[]).filter(function(c){return c.Active;}).map(function(c){return c.Confirmed_At+' · '+c.Confirmed_By;}).join(', ')||t('notConfirmed')]]);}
  Object.keys(schema.fields).forEach(function(key){if(key==='role'&&actorRole!=='ADMIN')return;var options=null,type='text';
    if(['description','summary','acceptanceCriteria','nextAction','evidence','trainingAction'].indexOf(key)>=0)type='textarea';
    if(['deadline','plannedStart','nextReviewDate'].indexOf(key)>=0)type='date';
    if(['durationValue','estimatedHours','actualHours','progress','capacity','requiredLevel','level'].indexOf(key)>=0)type='number';
    if(key==='enabled')type='checkbox';if(key==='email')type='email';
    if(key==='projectId')options=[{id:'',name:'—'}].concat(references.projects);
    if(key==='ownerId'||key==='memberId')options=[{id:'',name:'—'}].concat(references.members);
    if(key==='responsibilityId')options=[{id:'',name:'—'}].concat(references.responsibilities);
    if(key==='subprojectId'||key==='parentId')options=[{id:'',name:'—'}].concat((d.subprojects||[]).filter(function(s){return s.Subproject_ID!==d.id;}).map(function(s){return{id:s.Subproject_ID,name:s.Subproject_Name+' · '+statusLabel(s.Status)};}));
    if(key==='skillId')options=[{id:'',name:'—'}].concat((d.skills||[]).map(function(s){return{id:s.Skill_ID,name:s.Skill_Name};}));
    if(key==='statusField')options=d.type==='project'?['Planned','Active','On Hold','Completed','Cancelled']:['Not Started','Assigned','In Progress','Blocked','On Hold','Done','Cancelled'];
    if(key==='priority')options=['Low','Medium','High','Critical'].map(function(v){return{id:v,name:EH_I18N.priority(lang,v)};});
    if(key==='role')options=['MEMBER','VIEWER','MANAGER','ADMIN'];
    if(key==='visibility')options=[{id:'RESTRICTED',name:lang==='ja'?'非公開':'Restricted'},{id:'INTERNAL',name:lang==='ja'?'社内公開':'Internal'}];
    if(key==='durationUnit')options=[{id:'DAY',name:lang==='ja'?'日':'Days'},{id:'WEEK',name:lang==='ja'?'週':'Weeks'}];
    if(key==='durationBasis')options=[{id:'WORKING_DAYS',name:lang==='ja'?'営業日':'Working days'},{id:'CALENDAR_DAYS',name:lang==='ja'?'暦日':'Calendar days'}];
    var control=field(fields,key,d.values[key],options,function(v){d.values[key]=v;d.dirty=true;if(key==='projectId'){d.values.subprojectId='';d.values.parentId='';loadSubprojects(v,d);}},type);
    if((key==='plannedStart'&&d.values.durationValue)||(key==='projectId'&&d.type==='subproject'&&d.id))control.disabled=true;
    if(['name','taskName','email','projectId'].indexOf(key)>=0)control.required=true;
    if(d.type==='task'&&['ownerId','deadline'].indexOf(key)>=0)control.required=true;
  });
  // The required duration is optional: without it the planned start stays unknown, exactly as in
  // the existing manager sidebar and domain workflow.
  if(d.type==='task')fields.appendChild(el('p',t('durationHint'),'muted hint-wide'));
  var confirms=d.type==='project'?['confirmDeadlineChange','confirmResponsibilityChange','confirmRetiredResponsibility']:d.type==='subproject'?['confirmReparent']:d.type==='task'?['acknowledgeNonWorking','confirmDeadlineChange']:[];
  confirms.forEach(function(k){field(fields,k,d.values[k],null,function(v){d.values[k]=v;},'checkbox');});
  if(d.type==='task')button('plan',function(){api.read('plan',d.values,true).then(function(p){message.textContent=t('plannedStart')+': '+p.startDate+' · '+p.warnings.map(function(w){return EH_I18N.has('web.'+w.code)?t(w.code):EH_I18N.serverMessage(lang,w.code);}).join(', ');}).catch(function(e){message.textContent=e.message;});},form);
  var languageButton=el('button','日本語 | English');languageButton.type='button';languageButton.addEventListener('click',switchLanguage);form.appendChild(languageButton);
  var actions=el('div',undefined,'toolbar'),save=el('button',t('save'),'primary');save.type='submit';save.disabled=!!d.saving;actions.appendChild(save);
  button('close',function(){byId('editor').close();},actions);
  button('discard',function(){if(window.confirm(t('confirm'))){drafts.delete(currentEditor.key);currentEditor=null;byId('editor').close();}},actions);
  if(d.id&&(d.type==='project'||d.type==='task'))button('reloadDraft',function(){api.read(d.type,{id:d.id},true).then(function(result){message.replaceChildren(el('p',t('draft')));structured(result.record,message);button('useLatest',function(){if(window.confirm(t('confirm'))){drafts.delete(currentEditor.key);byId('editor').close();openEditor(d.type,d.id,result.record);}},message);});},actions);
  if(d.type==='task'&&d.id)['taskApprove','taskConfirm'].forEach(function(a){button(a,function(){act(a,{taskId:d.id,revision:d.original._revision},true).then(function(ok){if(ok)api.read('task',{id:d.id},true).then(function(r){d.original=r.record;d.original._confirmations=r.confirmations;renderEditor();});});},actions);});
  form.appendChild(actions);form.addEventListener('submit',function(e){e.preventDefault();if(d.saving)return;var savedKey=currentEditor.key;var payload={};Object.keys(schema.fields).forEach(function(k){if(k==='role'&&actorRole!=='ADMIN')return;if(d.id&&String(d.values[k])===String(d.base[k]))return;var target=k==='statusField'?'status':k==='enabled'?'active':k;payload[target]=d.values[k];});confirms.forEach(function(k){payload[k]=d.values[k]===true;});if(d.id){payload[schema.key]=d.id;payload.revision=d.original._revision;}if(d.type==='task'){payload.deadline=d.values.deadline;payload.durationValue=d.values.durationValue;payload.durationUnit=d.values.durationUnit;payload.durationBasis=d.values.durationBasis;}
    d.saving=true;save.disabled=true;message.textContent=t('saving');
    api.write(d.id?schema.save:schema.create,payload).then(function(){drafts.delete(savedKey);if(currentEditor&&currentEditor.draft===d){currentEditor=null;byId('editor').close();}load(true,t('saved'));}).catch(function(error){message.textContent=error.message;message.className='error';}).finally(function(){d.saving=false;save.disabled=false;});
  });host.appendChild(form);
}
function switchLanguage(){lang=EH_I18N.write(lang==='ja'?'en':'ja');renderNav();if(currentData)render();if(currentEditor)renderEditor();}
byId('language').addEventListener('click',switchLanguage);
byId('navToggle').addEventListener('click',function(){var hidden=document.body.classList.toggle('collapsed');byId('navToggle').setAttribute('aria-expanded',String(!hidden));});
window.addEventListener('beforeunload',function(e){if(pending.size||Array.from(drafts.values()).some(function(d){return d.dirty||d.note;})){e.preventDefault();e.returnValue='';}});
metrics.push({operation:'shell',renderMs:performance.now()});load(false);
}());
</script>
