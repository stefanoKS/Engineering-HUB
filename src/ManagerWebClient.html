/* ---------------------------------------------------------------- *
 * ADMIN layout helpers (V1.7.2)
 *
 * The administration pages are purpose built. A server payload is never dumped as a nested
 * key/value tree: each page shows readable cards, a status badge and, only on request, the
 * technical metadata behind an expandable details block.
 * ---------------------------------------------------------------- */

}
/** Boolean and mode states are text, never colour alone. */

}

function detailBlock(parent, rows) {

  adminFacts(details, rows);
  parent.appendChild(details);

/** Contract versions are compared component by component ("1.10" is newer than "1.6"). */
function contractParts(value) { return String(value || '').split('.').map(function (part) { return parseInt(part, 10) || 0; }); }
function contractCompare(left, right) {
  var a = contractParts(left), b = contractParts(right), length = Math.max(a.length, b.length);
  for (var index = 0; index < length; index++) {
    var one = a[index] || 0, two = b[index] || 0;
    if (one !== two) return one > two ? 1 : -1;
  }
  return 0;
}

/**
 * 共有ダッシュボード公開 (V1.7): publication status, the last successful run, the schedule, the
 * published counts and the two contract versions, each in its own card.
 *
 * Four different values are kept apart on purpose: the database schema version, the
 * application version, the publisher version and the snapshot contract. A publisher that
 * supports a newer contract than the published snapshot is an informational update, not a
 * failure; the publication itself is not changed by this page.
 */
function renderPublication(data, host) {
  var snapshot = data.snapshot || null;
  var counts = (snapshot && snapshot.counts) || {};
  var system = data.system || null;
  var configured = data.destinationConfigured === true;
  var failed = !!data.error || /^(FAIL|ERROR)/i.test(String(data.lastResult || ''));
  var enabled = data.enabled === true;
  // The contract of the published snapshot and the contract this publisher supports are
  // different facts: a newer publisher is an update waiting for the next publication.
  var publishedContract = (snapshot && snapshot.contractVersion) || '';
  var supportedContract = data.contractVersion || '';
  var comparison = publishedContract ? contractCompare(supportedContract, publishedContract) : 0;
  if (comparison > 0) banner(host, 'info', 'snapshotUpdateAvailable', {published: publishedContract, supported: supportedContract});
  else if (comparison < 0) banner(host, 'warn', 'snapshotContractNewer', {published: publishedContract, supported: supportedContract});

  var grid = adminGrid(host);
  var state = adminCard(grid, 'publicationState');
  var stateTone = !configured ? 'red' : failed ? 'red' : enabled ? 'green' : 'gray';
  var stateKey = !configured ? 'publicationNotConfigured' : failed ? 'publicationFailed' : enabled ? 'publicationEnabled' : 'publicationDisabled';
  cardBadge(state, t(stateKey), stateTone);
  if (!configured) state.appendChild(el('p', t('publicationNotConfiguredHint'), 'muted'));
  if (data.lastResult) adminFacts(state, [[t('lastResult'), data.lastResult]]);
  state.appendChild(el('p', t('publicationHint'), 'muted'));

  var lastSuccess = adminCard(grid, 'publicationLastSuccess');
  cardBadge(lastSuccess, timestampText(data.lastSuccessAt) || t('neverPublished'), timestampText(data.lastSuccessAt) ? 'green' : 'gray');
  adminFacts(lastSuccess, [[t('publishedAt'), timestampText(snapshot && snapshot.publishedAt)],
    [t('snapshotVersion'), snapshot ? snapshot.version : ''],
    [t('ageHours'), snapshot && snapshot.ageHours !== null && snapshot.ageHours !== undefined ? snapshot.ageHours : '']]);

  var auto = adminCard(grid, 'publicationAuto');
  stateBadge(auto, enabled, 'publicationEnabled', 'publicationDisabled');
  adminFacts(auto, [[t('publicationInterval'), data.intervalMinutes],
    [t('publicationApprovedBy'), data.approvedBy]]);

  var published = adminCard(grid, 'publicationCounts');
  adminFacts(published, [[t('responsibilities'), counts.responsibilities],
    [t('projects'), counts.projects], [t('subprojects'), counts.subprojects],
    [t('tasks'), counts.tasks], [t('milestones'), counts.milestones]]);
  if (!snapshot && configured) published.appendChild(el('p', t('publicationSnapshotUnreadable'), 'muted'));

  var contracts = adminCard(grid, 'publicationContract');
  adminFacts(contracts, [[t('publishedContract'), publishedContract],
    [t('supportedContract'), supportedContract]]);

  var versions = adminCard(grid, 'publicationVersions');
  adminFacts(versions, [[t('schemaVersion'), system ? system.schema : ''],
    [t('applicationVersion'), system ? system.version : ''],
    [t('publisherVersion'), data.publisherVersion],
    [t('snapshotVersion'), snapshot ? snapshot.version : '']]);

  // Failures are never hidden behind the details block.
  var problem = data.lastError || data.error || '';
  if (problem) {
    var errorCard = adminCard(grid, 'publicationLastError', 'admin-card-error');
    errorCard.appendChild(el('p', problem, 'error'));
  }

  var actions = el('div', undefined, 'admin-actions');
  button('publishNow', function () { act('publication', {}, true); }, actions);
  host.appendChild(actions);

  detailBlock(host, [[t('publisherVersion'), data.publisherVersion],
    [t('supportedContract'), supportedContract],
    [t('publishedContract'), publishedContract],
    [t('activeSlot'), snapshot ? snapshot.activeSlot : ''],
    [t('snapshotVersion'), snapshot ? snapshot.version : ''],
    [t('ageHours'), snapshot && snapshot.ageHours !== null && snapshot.ageHours !== undefined ? snapshot.ageHours : ''],
    [t('destinationConfigured'), configured ? t('enabledState') : t('disabledState')],
    [t('lastResult'), data.lastResult],
    [t('publicationLastVersion'), data.lastVersion],
    [t('publicationInterval'), data.intervalMinutes]]);
}

/**
 * システム状態 (V1.7): environment and database, application version, operational status,
 * integrations and the consistency result, in cards. Row counts and flags that a manager does
 * not need first stay in the details block; a security or configuration failure never does.
 */
function renderSystemStatus(data, host) {
  var grid = adminGrid(host);
  var valid = data.valid === true;

  var database = adminCard(grid, 'systemDatabase');
  cardBadge(database, data.environment || t('unknown'), data.environment ? 'green' : 'amber');
  adminFacts(database, [[t('environment'), data.environment], [t('schemaVersion'), data.schema]]);

  var application = adminCard(grid, 'application');
  cardBadge(application, data.version || t('unknown'), data.version ? 'gray' : 'amber');
  adminFacts(application, [[t('applicationVersion'), data.version]]);

  var health = adminCard(grid, 'systemHealth');
  cardBadge(health, valid ? t('systemValid') : t('systemInvalid', {count: data.errorCount || 0}), valid ? 'green' : 'red');
  adminFacts(health, [[t('errorCount'), data.errorCount === undefined ? '' : data.errorCount]]);

  var integrations = adminCard(grid, 'systemIntegrations');
  cardBadge(integrations, String(data.emailMode || 'OFF'), modeTone(data.emailMode));
  adminFacts(integrations, [[t('emailMode'), data.emailMode],
    [t('calendarSync'), data.calendarEnabled === true ? t('enabledState') : t('disabledState')],
    [t('dryRun'), data.dryRun === true ? t('enabledState') : t('disabledState')]]);

  var issues = adminCard(grid, 'systemIssues');
  if (!valid) {
    cardBadge(issues, t('systemInvalid', {count: data.errorCount || 0}), 'red');
    issues.appendChild(el('p', t('systemErrorHint'), 'muted'));
  } else {
    cardBadge(issues, t('systemValid'), 'green');
    issues.appendChild(el('p', t('noIssues'), 'muted'));
  }
  // An active emergency stop and an unverified identity are configuration facts a manager must see.
  if (data.emergencyStop === true) issues.appendChild(el('p', t('emergencyActive'), 'is-overdue'));
  issues.appendChild(el('p', t('readonly'), 'muted'));

  detailBlock(host, [[t('systemMeta'), ''],
    [t('errorCount'), data.errorCount],
    [t('EMERGENCY_STOP'), data.emergencyStop === true ? t('enabledState') : t('disabledState')],
    [t('dryRun'), data.dryRun === true ? t('enabledState') : t('disabledState')]]);
  var counts = data.rowCounts || {};

  if (countRows.length) {
    var table = el('details', undefined, 'admin-details');
    table.appendChild(el('summary', t('rowCounts')));
    adminFacts(table, countRows);
    host.appendChild(table);
  }
}

  if(d.type==='task')button('plan',function(){api.read('plan',d.values,true).then(function(p){message.textContent=t('plannedStart')+': '+p.startDate+' · '+p.warnings.map(function(w){return EH_I18N.has('web.'+w.code)?t(w.code):EH_I18N.serverMessage(lang,w.code);}).join(', ');}).catch(function(e){message.textContent=e.message;});},form);
  var languageButton=el('button','日本語 | English');languageButton.type='button';languageButton.addEventListener('click',switchLanguage);form.appendChild(languageButton);
  var actions=el('div',undefined,'toolbar'),save=el('button',t('save'),'primary');save.type='submit';save.disabled=!!d.saving;actions.appendChild(save);
  // V1.7: closing is closing. No confirmation, no draft question and no retained values.
  button('close',function(){closeEditor();},actions);
  if(d.type==='task'&&d.id)['taskApprove','taskConfirm'].forEach(function(a){button(a,function(){act(a,{taskId:d.id,revision:d.original._revision},true).then(function(ok){if(ok)api.read('task',{id:d.id},true).then(function(r){if(currentEditor!==d)return;d.original=r.record;d.original._confirmations=r.confirmations;renderEditor();});});},actions);});
  form.appendChild(actions);form.addEventListener('submit',function(e){e.preventDefault();if(d.saving)return;var payload={};Object.keys(schema.fields).forEach(function(k){if(k==='role'&&actorRole!=='ADMIN')return;if(d.id&&String(d.values[k])===String(d.base[k]))return;var target=k==='statusField'?'status':k==='enabled'?'active':k;payload[target]=d.values[k];});confirms.forEach(function(k){payload[k]=d.values[k]===true;});if(d.id){payload[schema.key]=d.id;payload.revision=d.original._revision;}if(d.type==='task'){payload.deadline=d.values.deadline;payload.durationValue=d.values.durationValue;payload.durationUnit=d.values.durationUnit;payload.durationBasis=d.values.durationBasis;}
    // A membership list is only sent when the manager actually changed it, so an untouched
    // form can never rewrite an assignment.
    if((d.type==='task'||d.type==='responsibility')&&JSON.stringify(d.additionalIds||[])!==JSON.stringify(d.baseAdditional||[])){
      if(d.type==='task')payload.additionalAssigneeIds=d.additionalIds||[];else payload.additionalMemberIds=d.additionalIds||[];
    }
    d.saving=true;save.disabled=true;message.textContent=t('saving');
    // One write per save: a second click is refused above, and a confirmed save closes the form.
    api.write(d.id?schema.save:schema.create,payload).then(function(result){if(currentEditor===d)closeEditor();settle(d.id?schema.save:schema.create,payload,result);success(t('saved'));}).catch(function(error){message.textContent=error.message;message.className='error';}).finally(function(){d.saving=false;save.disabled=false;});
  });host.appendChild(form);
}
function switchLanguage(){lang=EH_I18N.write(lang==='ja'?'en':'ja');renderNav();render();if(currentEditor)renderEditor();}
byId('language').addEventListener('click',switchLanguage);
byId('navToggle').addEventListener('click',function(){var hidden=document.body.classList.toggle('collapsed');byId('navToggle').setAttribute('aria-expanded',String(!hidden));});
if(byId('diagnostics'))byId('diagnostics').addEventListener('click',function(){navigate('diagnostics');});
// V1.7.3: a native dialog close (Escape, backdrop, browser UI) discards the form exactly like
// the close button. The handler never re-enters closeEditor, so it cannot reopen anything.
if(byId('editor')&&typeof byId('editor').addEventListener==='function')byId('editor').addEventListener('close',function(){if(currentEditor)discardEditor();});
window.addEventListener('focus',revalidateCurrent);
if(typeof document.addEventListener==='function')document.addEventListener('visibilitychange',function(){if(document.hidden!==true)revalidateCurrent();});
metrics.push({operation:'shell',renderMs:performance.now()});load(false);
