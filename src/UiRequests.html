<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #F4F6F8;
      --surface: #FFFFFF;
      --surface-soft: #F8FAFB;
      --text: #27333E;
      --text-soft: #526170;
      --muted: #526170;
      --accent: #365F7D;
      --accent-hover: #294D68;
      --accent-soft: #EAF1F6;
      --border: #D7DEE5;
      --green: #287348;
      --green-soft: #EAF4ED;
      --amber: #8C5A15;
      --amber-soft: #FBF3E6;
      --red: #A83E3A;
      --red-soft: #F9ECEB;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Meiryo", system-ui, sans-serif;
      font-size: 13px; line-height: 1.55; margin: 0; padding: 10px 10px 24px;
      background: var(--bg); color: var(--text);
    }
    h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
    fieldset {
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
      margin: 0 0 12px; padding: 10px 12px 12px;
    }
    legend { font-size: 14px; font-weight: 600; padding: 0 6px; }
    label { display: block; margin: 10px 0 3px; font-size: 13px; color: var(--text-soft); }
    input, select, textarea {
      width: 100%; padding: 8px 9px; font-size: 14px; font-family: inherit; color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; background: var(--surface); min-height: 38px;
    }
    button {
      margin-top: 10px; padding: 10px 12px; min-height: 40px; font-size: 14px; font-family: inherit;
      border: 1px solid var(--accent); border-radius: var(--radius); background: var(--accent);
      color: #fff; cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: var(--surface-soft); color: var(--text-soft); border-color: var(--border); }
    button.reject { background: var(--surface-soft); color: var(--red); border-color: var(--border); }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
    #status { margin-top: 4px; padding: 9px 10px; border-radius: 6px; display: none; white-space: pre-wrap; }
    #status.loading { display: block; background: var(--accent-soft); color: var(--text); }
    #status.error { display: block; background: var(--red-soft); color: var(--red); }
    #status.ok { display: block; background: var(--green-soft); color: var(--green); }
    .lang-switch { display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-bottom: 8px; font-size: 12px; }
    .lang-label { color: var(--muted); }
    .lang-option {
      margin: 0; padding: 4px 8px; background: var(--surface-soft); color: var(--text-soft);
      border: 1px solid var(--border); border-radius: 6px; font-size: 12px; min-height: 28px;
    }
    .lang-option.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .lang-sep { color: var(--border); }

    .request {
      border: 1px solid var(--border); border-left: 4px solid var(--border);
      border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; background: var(--surface-soft);
    }
    .request.is-stale { border-left-color: var(--amber); background: var(--amber-soft); }
    .req-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .req-type { font-size: 14px; font-weight: 600; }
    .status-badge {
      display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text-soft); white-space: nowrap;
    }
    .status-PENDING { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .status-STALE { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); }
    .status-APPROVED { border-color: var(--green); background: var(--green-soft); color: var(--green); }
    .status-REJECTED, .status-RETURNED { border-color: var(--red); background: var(--red-soft); color: var(--red); }
    .req-project { margin-top: 6px; font-weight: 600; }
    .req-task { color: var(--text-soft); }
    .req-dates { margin: 8px 0 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .req-dates dt { font-size: 12px; color: var(--muted); }
    .req-dates dd { margin: 0; font-weight: 600; }
    .req-diff.is-later { color: var(--amber); }
    .req-diff.is-earlier { color: var(--green); }
    .req-line { margin-top: 8px; }
    .req-line .label { display: block; font-size: 12px; color: var(--muted); }
    .req-explanation { margin-top: 8px; white-space: pre-wrap; word-break: break-word; }
    .req-meta { margin-top: 8px; font-size: 12px; color: var(--muted); }
    .req-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .req-actions button { flex: 1 1 auto; }
    .history-row { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
    .history-row:last-child { border-bottom: 0; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <?!= include('I18n') ?>
  <?!= include('UiSafe') ?>
  <?!= include('UiLang') ?>

  <h1 data-i18n="manager.requests.legend">申請一覧 / 承認待ち</h1>

  <fieldset>
    <div class="hint" data-i18n="manager.requests.hint">承認すると期限が更新され、予定開始日を再計算し、旧日程確認と割当承認を無効化します。却下・差戻しは期限を変更しません。</div>
    <div class="hint" data-i18n="manager.requests.autoImportHint">画面を開くと新しい申請を自動で取り込みます。取り込めない場合は下のボタンで再試行してください。</div>
    <div class="row">
      <button id="import" type="button" data-i18n="manager.requests.sync">申請を取り込む</button>
      <button id="refresh" type="button" class="secondary" data-i18n="common.retry">再試行</button>
    </div>
    <label for="requestFilter" data-i18n="manager.requests.filter">表示する申請</label>
    <select id="requestFilter">
      <option value="pending" data-i18n="manager.requests.pendingOnly">承認待ちのみ</option>
      <option value="all" data-i18n="manager.requests.all">すべて</option>
    </select>
    <div class="hint" id="summary"></div>
    <div class="hint" id="importNote"></div>
    <div id="requests"></div>
  </fieldset>

  <fieldset>
    <legend data-i18n="manager.requests.history">期限変更履歴</legend>
    <div id="history" class="hint" data-i18n="manager.loading">読み込み中...</div>
  </fieldset>

  <fieldset>
    <legend data-i18n="manager.requests.syncLegend">申請状態の同期確認</legend>
    <div class="hint" data-i18n="manager.requests.syncHint">作業者に表示される申請状態が、管理者の確定した判断と一致しているか確認できます。再同期は申請状態の表示だけを更新し、申請内容・タスク・判断は変更しません。</div>
    <div class="row">
      <button id="inboxPreview" type="button" data-i18n="manager.requests.syncPreview">申請状態の同期確認</button>
      <button id="inboxReconcile" type="button" class="secondary" data-i18n="manager.requests.syncApply">申請状態を再同期</button>
    </div>
    <div id="inboxState" class="hint"></div>
  </fieldset>

  <div id="status"></div>

  <script>
    var state = {data: null, includeDecided: false};

    function T(key, vars) { return EHLang.t(key, vars); }
    function byId(id) { return document.getElementById(id); }
    function setStatus(kind, message) { EH.setStatus(byId('status'), kind, message); }

    function call(fn, payload, onSuccess) {
      setStatus('loading', T('common.processing'));
      var runner = google.script.run
        .withSuccessHandler(function (result) {
          if (!result || result.ok !== true) {
            setStatus('error', T('common.error') + ': ' + EHLang.serverMessage((result && result.error) || T('common.unknown')));
            return;
          }
          setStatus('ok', T('common.done'));
          // A payload that violates the response contract is reported, never rendered as empty.
          if (onSuccess) {
            try { onSuccess(result.data); }
            catch (error) { setStatus('error', T('common.error') + ': ' + EHLang.serverMessage(error.message)); }
          }
        })
        .withFailureHandler(function (error) { setStatus('error', T('common.error') + ': ' + error.message); });
      if (payload === undefined) runner[fn](); else runner[fn](payload);
    }

    function load() {
      call('uiRequests', {includeDecided: state.includeDecided === true}, function (data) {
        state.data = data;
        render();
      });
    }

    function text(value) { return value === '' || value === null || value === undefined ? T('common.none') : String(value); }

    function difference(request) {
      if (request.differenceDays === null || request.differenceDays === undefined) return {text: T('common.none'), className: ''};
      var value = Number(request.differenceDays);
      return {
        text: (value > 0 ? '+' : '') + value + T('manager.requests.daysSuffix'),
        className: value > 0 ? 'is-later' : (value < 0 ? 'is-earlier' : '')
      };
    }

    /** A dated cell is shown as a date; the technical timestamp stays in the small meta line. */
    function day(value) {
      if (!value) return T('common.none');
      var match = /^\d{4}-\d{2}-\d{2}/.exec(String(value));
      return match ? match[0] : String(value);
    }

    function decide(request, action) {
      if (!EH.confirmAction(T('manager.requests.confirmPrompt', {action: T('manager.requests.' + action.toLowerCase())}))) return;
      var note = byId('note-' + request.requestId);
      call('uiDecideRequest', {
        requestId: request.requestId,
        action: action,
        note: note ? note.value : '',
        confirmation: 'DECIDE REQUEST'
      }, function () { load(); });
    }

    function datePair(label, value, className) {
      var wrap = EH.element('div');
      EH.append(wrap, 'dt', label);
      EH.append(wrap, 'dd', text(value), className || '');
      return wrap;
    }

    function line(label, value, className) {
      var wrap = EH.element('div', 'req-line' + (className ? ' ' + className : ''));
      EH.append(wrap, 'span', label, 'label');
      EH.append(wrap, 'span', text(value));
      return wrap;
    }

    function renderRequest(request) {
      var card = EH.element('div', 'request' + (request.stale ? ' is-stale' : ''));
      var head = EH.element('div', 'req-head');
      EH.append(head, 'span', T('manager.requests.type.' +
        (request.type === 'COMPLETION_REPORT' ? 'COMPLETION_REPORT' : 'DEADLINE_CHANGE')), 'req-type');
      EH.append(head, 'span', T('request.status.' + request.status), 'status-badge status-' + request.status);
      card.appendChild(head);

      // Priority order from the specification: type, project, task, deadlines, reason, requester.
      EH.append(card, 'div', request.projectName || T('common.none'), 'req-project');
      EH.append(card, 'div', request.taskName || T('common.none'), 'req-task');

      var dates = EH.element('dl', 'req-dates');
      var diff = difference(request);
      dates.appendChild(datePair(T('manager.requests.currentDeadline'), day(request.currentDeadline)));
      if (request.type === 'DEADLINE_CHANGE') {
        dates.appendChild(datePair(T('manager.requests.requestedDeadline'), day(request.requestedDeadline)));
      } else {
        dates.appendChild(datePair(T('request.completion.reported'), day(request.reportedCompletionAt)));
      }
      dates.appendChild(datePair(T('manager.requests.difference'), diff.text, 'req-diff ' + diff.className));
      card.appendChild(dates);

      if (request.type === 'DEADLINE_CHANGE') {
        card.appendChild(line(T('manager.requests.reason'), request.reason));
        card.appendChild(line(T('manager.requests.explanation'), request.explanation, 'req-explanation'));
      } else {
        card.appendChild(line(T('request.completion.note'), request.completionNote, 'req-explanation'));
      }
      card.appendChild(line(T('manager.requests.requester'), request.requesterName));

      if (request.stale) {
        EH.append(card, 'div', T('manager.requests.staleNote'), 'hint');
      }

      if (request.status === 'PENDING' || request.status === 'STALE') {
        var noteLabel = EH.append(card, 'label', T('manager.requests.decisionNote'));
        noteLabel.setAttribute('for', 'note-' + request.requestId);
        var note = EH.element('input');
        note.id = 'note-' + request.requestId;
        note.setAttribute('id', 'note-' + request.requestId);
        card.appendChild(note);
        var actions = EH.element('div', 'req-actions');
        var approve = EH.append(actions, 'button', T('manager.requests.approve'));
        approve.setAttribute('type', 'button');
        approve.addEventListener('click', function () { decide(request, 'APPROVE'); });
        var reject = EH.append(actions, 'button', T('manager.requests.reject'), 'reject');
        reject.setAttribute('type', 'button');
        reject.addEventListener('click', function () { decide(request, 'REJECT'); });
        var returned = EH.append(actions, 'button', T('manager.requests.return'), 'secondary');
        returned.setAttribute('type', 'button');
        returned.addEventListener('click', function () { decide(request, 'RETURN'); });
        card.appendChild(actions);
      } else {
        card.appendChild(line(T('manager.requests.decisionNote'), request.decisionNote));
      }

      // Technical identifiers and timestamps stay secondary.
      var meta = [
        request.requestId,
        request.projectId || '',
        request.taskId || '',
        T('manager.requests.submittedAt') + ' ' + text(request.submittedAt),
        request.decidedAt ? T('manager.requests.decidedAt') + ' ' + request.decidedAt : ''
      ].filter(Boolean).join(' · ');
      EH.append(card, 'div', meta, 'req-meta');
      return card;
    }

    function render() {
      var data = state.data || {requests: [], history: [], counts: {}, configured: false};
      // `requests` is a required field of the queue payload: a missing or non-array value is a
      // contract failure reported by the `call` handler, never a false "no requests" state.
      var requests = EH.requireArray(data.requests, 'requests');
      var historyRows = EH.optionalArray(data.history, 'history');
      var container = byId('requests');
      EH.clear(container);
      var counts = data.counts || {};
      byId('summary').textContent = T('manager.requests.summary', {
        pending: counts.PENDING || 0, stale: counts.STALE || 0, approved: counts.APPROVED || 0,
        rejected: counts.REJECTED || 0
      }) + (data.configured ? '' : ' ' + T('manager.requests.inboxMissing'));
      var imported = data.imported || null;
      var note = byId('importNote');
      note.className = 'hint';
      if (data.importError) {
        note.textContent = T('manager.requests.importFailed', {message: EHLang.serverMessage(data.importError)});
      } else if (imported && imported.imported) {
        note.textContent = T('manager.requests.imported', {
          imported: imported.imported, skipped: imported.skipped || 0, rejected: imported.rejected || 0
        });
      } else {
        note.textContent = '';
      }
      if (!requests.length) {
        EH.append(container, 'div', T('manager.requests.empty'), 'hint');
      } else {
        requests.forEach(function (request) { container.appendChild(renderRequest(request)); });
      }

      var history = byId('history');
      EH.clear(history);
      if (!historyRows.length) {
        EH.append(history, 'div', T('manager.requests.historyEmpty'), 'hint');
      } else {
        historyRows.forEach(function (row) {
          EH.append(history, 'div', row.previousDeadline + ' → ' + row.newDeadline + '  ' +
            (row.previousStart || '-') + ' → ' + (row.newStart || '-') + '  ' + row.changedAt + '  ' + (row.changedBy || ''),
            'history-row');
        });
      }
    }

    byId('import').addEventListener('click', function () {
      call('uiImportRequests', undefined, function (result) {
        setStatus('ok', T('manager.requests.imported', {imported: result.imported, skipped: result.skipped, rejected: result.rejected}));
        load();
      });
    });
    byId('refresh').addEventListener('click', load);

    /* V1.6.2: receipt reconciliation. The preview is read-only; the repair only rewrites the
       mirrored Inbox_State and says so, including rows it refused to touch. */
    function inboxStateLabel(state) {
      var key = 'manager.requests.inboxState.' + state;
      return EH_I18N.has(key) ? T(key) : String(state);
    }
    function renderInboxState(data) {
      var host = byId('inboxState');
      EH.clear(host);
      host.className = 'hint';
      if (!data || data.available !== true) {
        EH.append(host, 'div', T('manager.requests.syncUnavailable', {message: EHLang.serverMessage((data && data.error) || T('common.unknown'))}), 'error');
        return;
      }
      var counts = data.counts || {};
      EH.append(host, 'div', T('manager.requests.syncSummary', {
        synced: counts.synced || 0, needsSync: counts.needsSync || 0,
        missing: counts.missing || 0, mismatch: counts.mismatch || 0
      }));
      if (data.truncated) EH.append(host, 'div', T('manager.requests.syncTruncated'), 'error');
      var mismatched = (data.items || []).filter(function (item) { return item.state !== 'ALREADY_SYNCED'; });
      if (!mismatched.length) {
        EH.append(host, 'div', T('manager.requests.syncAllMatch'));
        return;
      }
      mismatched.forEach(function (item) {
        EH.append(host, 'div', item.requestId + ' · ' + item.taskId + ' · ' +
          T('manager.requests.status') + ' ' + item.managerStatus + ' / ' +
          T('manager.requests.syncInbox') + ' ' + (item.inboxState || T('common.none')) +
          ' · ' + inboxStateLabel(item.state), 'history-row');
      });
    }
    byId('inboxPreview').addEventListener('click', function () {
      call('uiRequestInboxPreview', undefined, renderInboxState);
    });
    byId('inboxReconcile').addEventListener('click', function () {
      if (!EH.confirmAction(T('manager.requests.syncConfirm'))) return;
      call('uiRequestInboxReconcile', {confirmation: 'RECONCILE REQUEST INBOX'}, function (result) {
        setStatus('ok', T('manager.requests.syncRepaired', {
          updated: result.updated, synced: result.alreadySynced,
          missing: result.missing, mismatch: result.mismatch, failed: (result.failed || []).length
        }));
        call('uiRequestInboxPreview', undefined, renderInboxState);
      });
    });
    byId('requestFilter').addEventListener('change', function () {
      state.includeDecided = byId('requestFilter').value === 'all';
      load();
    });

    EHLang.wire(function () { render(); });
    load();
  </script>
</body>
</html>
