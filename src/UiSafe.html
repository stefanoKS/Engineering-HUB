<script>
  /**
   * Safe DOM helpers shared by the bound sidebars.
   *
   * Operational text (names, subjects, error messages, history rows) is spreadsheet content
   * and therefore untrusted: it is always assigned through textContent on created nodes.
   * This module never builds markup from data and never touches innerHTML.
   */
  var EH = (function () {
    function text(value) { return value === undefined || value === null ? '' : String(value); }

    function clear(node) {
      while (node.firstChild) node.removeChild(node.firstChild);
      return node;
    }

    function element(tag, className, value) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (value !== undefined) node.textContent = text(value);
      return node;
    }

    function append(parent, tag, value, className) {
      var node = element(tag, className, value);
      parent.appendChild(node);
      return node;
    }

    function renderLines(container, lines, className) {
      clear(container);
      (lines || []).forEach(function (line) { append(container, 'div', line, className); });
      return container;
    }

    function renderRecords(container, records, formatter, emptyLabel) {
      clear(container);
      if (!records || !records.length) {
        append(container, 'div', emptyLabel || '該当なし', 'hint');
        return container;
      }
      records.forEach(function (record) {
        append(container, 'div', formatter(record));
      });
      return container;
    }

    function fillSelect(select, items, valueKey, labelKey, blankLabel) {
      clear(select);
      if (blankLabel !== undefined && blankLabel !== null) {
        var blank = element('option', null, blankLabel);
        blank.value = '';
        select.appendChild(blank);
      }
      (items || []).forEach(function (item) {
        var option = element('option', null, item[labelKey]);
        option.value = item[valueKey];
        select.appendChild(option);
      });
      return select;
    }

    function setStatus(node, kind, message) {
      node.className = kind;
      node.textContent = text(message);
      return node;
    }

    function confirmAction(message) { return window.confirm(message); }

    /**
     * Response contracts for a remote payload.
     *
     * A field the server always sends is required: a missing or non-array value is a broken
     * contract, not an empty result, so it raises instead of silently showing "no records".
     * A documented-optional list normalizes to an empty array. Callers render inside a `call`
     * handler, which turns the error into one readable status message.
     */
    function contractError(detail) { return new Error('INVALID_RESPONSE: ' + detail); }

    function requireArray(value, field) {
      if (!Array.isArray(value)) throw contractError('expected array for ' + field);
      return value;
    }

    function optionalArray(value, field) {
      if (value === undefined || value === null) return [];
      return requireArray(value, field);
    }

    function requireObject(value, field) {
      if (!value || typeof value !== 'object' || Array.isArray(value)) {
        throw contractError('expected object for ' + field);
      }
      return value;
    }

    return {
      text: text,
      clear: clear,
      element: element,
      append: append,
      renderLines: renderLines,
      renderRecords: renderRecords,
      fillSelect: fillSelect,
      setStatus: setStatus,
      confirmAction: confirmAction,
      requireArray: requireArray,
      optionalArray: optionalArray,
      requireObject: requireObject
    };
  }());
</script>
