<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #F4F6F8; --surface: #FFFFFF; --surface-soft: #F8FAFB;
      --text: #27333E; --text-soft: #526170; --muted: #526170;
      --accent: #365F7D; --accent-hover: #294D68; --accent-soft: #EAF1F6;
      --border: #D7DEE5; --green: #287348; --green-soft: #EAF4ED;
      --amber: #8C5A15; --amber-soft: #FBF3E6; --red: #A83E3A; --red-soft: #F9ECEB;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Meiryo", system-ui, sans-serif;
      font-size: 13px; line-height: 1.55; margin: 0; padding: 10px 10px 24px;
      background: var(--bg); color: var(--text);
    }
    h1 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
    h2 { font-size: 14px; margin: 0 0 6px; font-weight: 600; }
    section.card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px 12px 12px; margin-bottom: 12px;
    }
    details.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0 12px 12px; }
    details.card > summary { cursor: pointer; padding: 11px 0; font-size: 14px; font-weight: 600; color: var(--text-soft); }
    pre {
      background: var(--surface-soft); border: 1px solid var(--border); padding: 8px;
      border-radius: 6px; white-space: pre-wrap; word-break: break-word; font-size: 12px; margin: 0;
    }
    button {
      padding: 10px 12px; min-height: 40px; font-size: 14px; font-family: inherit;
      border: 1px solid var(--accent); border-radius: var(--radius); background: var(--accent);
      color: #fff; cursor: pointer; margin-bottom: 12px;
    }
    button:hover { background: var(--accent-hover); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #status { margin-bottom: 10px; color: var(--red); font-size: 13px; }
    #status:empty { display: none; }
    .facts { display: grid; grid-template-columns: 1fr; gap: 6px; }
    .fact { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
    .fact:last-child { border-bottom: 0; }
    .fact .label { color: var(--muted); font-size: 12px; }
    .fact .value { font-weight: 600; text-align: right; word-break: break-word; }
    .badge {
      display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); background: var(--surface-soft); color: var(--text-soft);
    }
    .badge.is-ok { border-color: var(--green); background: var(--green-soft); color: var(--green); }
    .badge.is-warn { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); }
    .badge.is-error { border-color: var(--red); background: var(--red-soft); color: var(--red); }
    .error-list { margin: 0; padding-left: 18px; font-size: 12px; color: var(--red); }
    .lang-switch { display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-bottom: 8px; font-size: 12px; }
    .lang-label { color: var(--muted); }
    .lang-option {
      margin: 0; padding: 4px 8px; background: var(--surface-soft); color: var(--text-soft);
      border: 1px solid var(--border); border-radius: 6px; font-size: 12px; min-height: 28px;
    }
    .lang-option.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .lang-sep { color: var(--border); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <?!= include('I18n') ?>
  <?!= include('UiSafe') ?>
  <?!= include('UiLang') ?>

  <h1 data-i18n="manager.menu.system">システム状態</h1>
  <button onclick="load()" type="button" data-i18n="common.retry">再読み込み</button>
  <div id="status" role="status" aria-live="polite"></div>

  <section class="card">
    <h2 data-i18n="system.section.status">状態</h2>
    <div class="facts" id="facts"></div>
  </section>

  <section class="card">
    <h2 data-i18n="system.triggers">トリガー</h2>
    <div class="facts" id="triggerFacts"></div>
    <pre id="triggerDetail"></pre>
  </section>

  <section class="card">
    <h2 data-i18n="system.rows">行数</h2>
    <pre id="rows"></pre>
  </section>

  <section class="card">
    <h2 data-i18n="system.validationErrors">検証エラー</h2>
    <ul class="error-list" id="errors"></ul>
  </section>

  <details class="card" id="systemRaw">
    <summary data-i18n="system.section.raw">すべての診断情報</summary>
    <pre id="output"></pre>
  </details>

  <script>
    function T(key, vars) { return EHLang.t(key, vars); }
    function byId(id) { return document.getElementById(id); }
    function setStatus(message) { byId('status').textContent = message; }

    function fact(container, label, value, badgeClass) {
      var row = EH.element('div', 'fact');
      EH.append(row, 'span', label, 'label');
      EH.append(row, 'span', value, 'value' + (badgeClass ? ' badge ' + badgeClass : ''));
      container.appendChild(row);
    }

    function render(data) {
      // `health`, `triggers` and their lists are required fields of the status payload: a
      // missing one is a contract failure (reported by the loader), not "no triggers installed".
      data = EH.requireObject(data, 'status');
      var health = EH.requireObject(data.health, 'status.health');
      var triggers = EH.requireObject(data.triggers, 'status.triggers');
      triggers.installed = EH.requireArray(triggers.installed, 'status.triggers.installed');
      triggers.missing = EH.requireArray(triggers.missing, 'status.triggers.missing');
      triggers.obsolete = EH.requireArray(triggers.obsolete, 'status.triggers.obsolete');
      triggers.duplicates = EH.requireArray(triggers.duplicates, 'status.triggers.duplicates');
      data.errors = EH.optionalArray(data.errors, 'status.errors');
      data.rowCounts = data.rowCounts && typeof data.rowCounts === 'object' ? data.rowCounts : {};
      var lines = [];
      lines.push(T('system.environment') + ': ' + health.environment);
      lines.push(T('system.emailMode') + ': ' + health.emailMode + ' (' + health.emailModeReason + ')');
      lines.push(T('system.automationConfigured') + ': ' + (health.automationConfigured ? T('common.yes') : T('common.no')));
      lines.push(T('system.notificationsActivated') + ': ' + (health.notificationsActivated ? T('common.yes') : T('common.no')));
      lines.push(T('system.calendar') + ': ' + (health.calendarEnabled ? T('system.enabled') : T('system.disabled')));
      lines.push(T('system.validation') + ': ' + (data.valid ? 'OK' : T('system.error') + ' ' + data.errorCount + T('common.items')));
      lines.push(T('system.triggers') + ': ' + triggers.installed.join(', '));
      lines.push(T('system.triggerMatch') + ': ' + (triggers.scheduleMatches ? T('system.matches') : T('system.reinstall')));
      if (triggers.missing.length) lines.push(T('system.missingTriggers') + ': ' + triggers.missing.join(', '));
      if (triggers.obsolete.length) lines.push(T('system.obsoleteTriggers') + ': ' + triggers.obsolete.join(', '));
      if (triggers.duplicates.length) lines.push(T('system.duplicateTriggers') + ': ' + triggers.duplicates.length + T('common.items'));
      lines.push(T('system.rows') + ': ' + Object.keys(data.rowCounts).map(function (key) {
        return key + '=' + data.rowCounts[key];
      }).join(', '));
      if (data.errors.length) {
        lines.push('');
        lines.push(T('system.validationErrors') + ':');
        data.errors.forEach(function (error) { lines.push('- ' + error); });
      }
      // The complete diagnostic dump stays available; the cards above are the readable view.
      byId('output').textContent = lines.join('\n');

      var facts = byId('facts');
      EH.clear(facts);
      fact(facts, T('system.environment'), String(health.environment || T('common.none')));
      fact(facts, T('system.emailMode'), health.emailMode + ' (' + health.emailModeReason + ')',
        health.emailMode === 'LIVE' ? 'is-error' : (health.emailMode === 'PREVIEW' ? 'is-warn' : ''));
      fact(facts, T('system.automationConfigured'), health.automationConfigured ? T('common.yes') : T('common.no'));
      fact(facts, T('system.notificationsActivated'), health.notificationsActivated ? T('common.yes') : T('common.no'));
      fact(facts, T('system.calendar'), health.calendarEnabled ? T('system.enabled') : T('system.disabled'),
        health.calendarEnabled ? 'is-warn' : '');
      fact(facts, T('system.validation'),
        data.valid ? T('system.ok') : T('system.error') + ' ' + data.errorCount + T('common.items'),
        data.valid ? 'is-ok' : 'is-error');

      var triggerFacts = byId('triggerFacts');
      EH.clear(triggerFacts);
      fact(triggerFacts, T('system.triggerMatch'),
        triggers.scheduleMatches ? T('system.matches') : T('system.reinstall'),
        triggers.scheduleMatches ? 'is-ok' : 'is-warn');
      fact(triggerFacts, T('system.missingTriggers'), String(triggers.missing.length),
        triggers.missing.length ? 'is-warn' : 'is-ok');
      fact(triggerFacts, T('system.obsoleteTriggers'), String(triggers.obsolete.length),
        triggers.obsolete.length ? 'is-warn' : 'is-ok');
      fact(triggerFacts, T('system.duplicateTriggers'), String(triggers.duplicates.length),
        triggers.duplicates.length ? 'is-warn' : 'is-ok');

      // The raw diagnostic detail stays available below the readable summary.
      var detail = [];
      detail.push(T('system.triggers') + ': ' + triggers.installed.join(', '));
      if (triggers.missing.length) detail.push(T('system.missingTriggers') + ': ' + triggers.missing.join(', '));
      if (triggers.obsolete.length) detail.push(T('system.obsoleteTriggers') + ': ' + triggers.obsolete.join(', '));
      byId('triggerDetail').textContent = detail.join('\n');

      byId('rows').textContent = Object.keys(data.rowCounts).map(function (key) {
        return key + ' = ' + data.rowCounts[key];
      }).join('\n');

      var errors = byId('errors');
      EH.clear(errors);
      var list = (data.errors || []).filter(function (error) { return !!error; });
      if (!list.length) {
        EH.append(errors, 'li', T('system.ok'));
      } else {
        list.forEach(function (error) { EH.append(errors, 'li', error); });
      }
    }

    function load() {
      setStatus('');
      google.script.run
        .withSuccessHandler(function (result) {
          if (!result || result.ok !== true) {
            setStatus(T('common.error') + ': ' + EHLang.serverMessage((result && result.error) || T('common.unknown')));
            return;
          }
          // A payload that violates the response contract is reported, never rendered as "OK".
          try { render(result.data); }
          catch (error) { setStatus(T('common.error') + ': ' + EHLang.serverMessage(error.message)); }
        })
        .withFailureHandler(function (error) { setStatus(T('common.error') + ': ' + error.message); })
        .uiSystemStatus();
    }
    EHLang.wire(load);
    load();
  </script>
</body>
</html>
