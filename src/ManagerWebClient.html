/**
 * Records a confirmed write: the snapshot is patched where it can be, the current view is

 * no loss of unrelated cached views; "Saved" is shown only after the server confirmed the write.
 */
function settle(action, payload, result) {
  patchSummary(action, payload, result);
  // A project write can move work between areas and replaces the area data, so the previous
  // rows are cleared instead of being left on screen as the current responsibility's result.
  if (/^project/.test(action) && (view === 'tasks' || view === 'projects')) currentData = null;
  repaintIfAllowed();
  revalidateView(view === 'admin' || view === 'diagnostics' ? 'overview' : view);
  // The index repeats each task's project responsibility, so it is refetched after a project
  // write instead of being left empty until the next snapshot revalidation.
  if (/^project/.test(action)) syncTaskIndex(true);

function dayText(value) {
  if (!value) return '';

  var date = new Date(value);
  if (isNaN(date.getTime())) return '';
  return date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);
}

  var area = areas[String(row.Responsibility_ID || '')] || null;

}

/** Cached record for an instant form; the server copy is fetched separately. */
