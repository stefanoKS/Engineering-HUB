<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 12px; margin: 8px; color: #202124; }
    h2 { font-size: 14px; margin: 10px 0 6px; }
    pre { background: #f8f9fa; padding: 8px; border-radius: 4px; white-space: pre-wrap; word-break: break-word; font-size: 11px; }
    button { padding: 6px 10px; border: 0; border-radius: 4px; background: #1a73e8; color: #fff; cursor: pointer; }
    #status { margin-top: 8px; color: #b3261e; }
    .lang-switch { display: flex; align-items: center; gap: 4px; justify-content: flex-end; margin-bottom: 6px; font-size: 11px; }
    .lang-label { color: #5f6368; }
    .lang-option { margin: 0; padding: 2px 6px; background: #f1f3f4; color: #202124; border-radius: 4px; }
    .lang-option.is-active { background: #1a73e8; color: #fff; }
    .lang-sep { color: #bdc1c6; }
  </style>
</head>
<body>
  <?!= include('I18n') ?>
  <?!= include('UiSafe') ?>
  <?!= include('UiLang') ?>

  <h2 data-i18n="manager.menu.system">システム状態</h2>
  <button onclick="load()" data-i18n="common.retry">再読み込み</button>
  <div id="status"></div>
  <pre id="output" data-i18n="manager.loading">読み込み中...</pre>

  <script>
    function T(key, vars) { return EHLang.t(key, vars); }
    function setStatus(message) { document.getElementById('status').textContent = message; }

    function render(data) {
      var lines = [];
      lines.push(T('system.environment') + ': ' + data.health.environment);
      lines.push(T('system.emailMode') + ': ' + data.health.emailMode + ' (' + data.health.emailModeReason + ')');
      lines.push(T('system.automationConfigured') + ': ' + (data.health.automationConfigured ? T('common.yes') : T('common.no')));
      lines.push(T('system.notificationsActivated') + ': ' + (data.health.notificationsActivated ? T('common.yes') : T('common.no')));
      lines.push(T('system.calendar') + ': ' + (data.health.calendarEnabled ? T('system.enabled') : T('system.disabled')));
      lines.push(T('system.validation') + ': ' + (data.valid ? 'OK' : T('system.error') + ' ' + data.errorCount + T('common.items')));
      lines.push(T('system.triggers') + ': ' + data.triggers.installed.join(', '));
      lines.push(T('system.triggerMatch') + ': ' + (data.triggers.scheduleMatches ? T('system.matches') : T('system.reinstall')));
      if (data.triggers.missing.length) lines.push(T('system.missingTriggers') + ': ' + data.triggers.missing.join(', '));
      if (data.triggers.obsolete.length) lines.push(T('system.obsoleteTriggers') + ': ' + data.triggers.obsolete.join(', '));
      if (data.triggers.duplicates.length) lines.push(T('system.duplicateTriggers') + ': ' + data.triggers.duplicates.length + T('common.items'));
      lines.push(T('system.rows') + ': ' + Object.keys(data.rowCounts).map(function (key) {
        return key + '=' + data.rowCounts[key];
      }).join(', '));
      if (data.errors.length) {
        lines.push('');
        lines.push(T('system.validationErrors') + ':');
        data.errors.forEach(function (error) { lines.push('- ' + error); });
      }
      document.getElementById('output').textContent = lines.join('\n');
    }

    function load() {
      setStatus('');
      google.script.run
        .withSuccessHandler(function (result) {
          if (!result || result.ok !== true) {
            setStatus(T('common.error') + ': ' + EHLang.serverMessage((result && result.error) || T('common.unknown')));
            return;
          }
          render(result.data);
        })
        .withFailureHandler(function (error) { setStatus(T('common.error') + ': ' + error.message); })
        .uiSystemStatus();
    }
    EHLang.wire(load);
    load();
  </script>
</body>
</html>
