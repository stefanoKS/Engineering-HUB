name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eh_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d eh_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      # A real PostgreSQL instance, not a mock. REQUIRE_DATABASE makes a missing database a
      # failure instead of a skipped suite, so a green run always proves the SQL paths.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eh_test
      REQUIRE_DATABASE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - name: Production artifact smoke test
        run: npm run smoke:prod
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eh_test
      - name: Container configuration validation
        run: |
          cp deploy/.env.example deploy/.env
          docker compose --project-directory deploy config > /dev/null
          docker run --rm -e APP_DOMAIN=engineering-hub.example.co.jp \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
        env:
          POSTGRES_PASSWORD: example
          APP_DOMAIN: engineering-hub.example.co.jp