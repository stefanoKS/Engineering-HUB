<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-soft: #fbfbfd;
    --border: #e5e7eb;
    --border-strong: #d3d7de;
    --text: #1f2328;
    --text-soft: #4a5160;
    --muted: #6b7280;
    --accent: #2f5bd7;
    --accent-soft: #eef2fd;
    --green: #1e7e34;
    --green-soft: #e8f5eb;
    --amber: #9a5b00;
    --amber-soft: #fdf3e2;
    --red: #b3261e;
    --red-soft: #fdecea;
    --gray-soft: #f1f2f5;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 24px rgba(16, 24, 40, 0.05);
    --tap: 44px;
  }

  * { box-sizing: border-box; }

  /* Author display rules such as display:flex must never defeat the hidden attribute. */
  [hidden] { display: none !important; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic",
      "Meiryo", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: 0.01em; }
  p { margin: 0; }
  ul { margin: 0; padding: 0; list-style: none; }
  button, input, select { font: inherit; color: inherit; }

  a { color: var(--accent); }

  :focus-visible {
    outline: 3px solid rgba(47, 91, 215, 0.45);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .skip-link {
    position: absolute;
    left: 8px;
    top: -60px;
    z-index: 100;
    background: var(--accent);
    color: #fff;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    text-decoration: none;
  }
  .skip-link:focus { top: 8px; }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .shell { max-width: 1240px; margin: 0 auto; padding: 0 20px 64px; }

  /* ---------- top bar ---------- */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    max-width: 1240px;
    margin: 0 auto;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand-mark {
    width: 40px;
    height: 40px;
    flex: 0 0 auto;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .brand-title { font-size: 18px; line-height: 1.35; }
  .brand-sub { font-size: 12px; color: var(--muted); }
  .sync {
    font-size: 12px;
    color: var(--text-soft);
    background: var(--gray-soft);
    border-radius: 999px;
    padding: 6px 14px;
    white-space: nowrap;
  }

  /* ---------- notices ---------- */
  .notices { display: grid; gap: 10px; margin: 18px 0 0; }
  .notice {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 13.5px;
    border: 1px solid transparent;
  }
  .notice-warn { background: var(--amber-soft); border-color: #f0dcb8; color: #6b4700; }
  .notice-error { background: var(--red-soft); border-color: #f6cfcb; color: #7d1a15; }
  .notice-info { background: var(--accent-soft); border-color: #d6e0fb; color: #243a8a; }
  .notice-strong { font-weight: 600; }

  /* ---------- indicators ---------- */
  .kpis {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 22px 0 0;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .kpi-label { font-size: 12.5px; color: var(--muted); }
  .kpi-value { font-size: 26px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .kpi-unit { font-size: 12px; color: var(--muted); margin-left: 2px; font-weight: 400; }
  .kpi.is-risk .kpi-value { color: var(--red); }

  /* ---------- toolbar ---------- */
  .toolbar {
    margin: 26px 0 14px;
    display: grid;
    gap: 12px;
  }
  .search-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .search-field {
    position: relative;
    flex: 1 1 260px;
    min-width: 0;
  }
  .search-field input {
    width: 100%;
    min-height: var(--tap);
    padding: 10px 14px 10px 40px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
  }
  .search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 14px;
    pointer-events: none;
  }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 0 10px;
    min-height: var(--tap);
  }
  .filter span { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .filter select {
    border: 0;
    background: transparent;
    min-height: 38px;
    max-width: 170px;
    padding-right: 4px;
  }
  .chip {
    min-height: var(--tap);
    padding: 0 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--surface);
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: #b9c8f6;
    color: #1e3a8a;
    font-weight: 600;
  }
  .toolbar-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .result-count { font-size: 13px; color: var(--muted); }
  .link-button {
    border: 0;
    background: none;
    color: var(--accent);
    padding: 6px 2px;
    cursor: pointer;
    font-size: 13px;
    text-decoration: underline;
  }

  /* ---------- project list ---------- */
  .section-title { font-size: 15px; color: var(--text-soft); margin: 6px 0 12px; }

  .project-list {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .project-card {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    cursor: pointer;
    transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
  }
  .project-card:hover { border-color: #c2cbdb; box-shadow: var(--shadow); }
  .project-card:active { transform: translateY(1px); }
  .project-card.is-risk { border-left: 4px solid var(--red); padding-left: 15px; }
  .project-card.is-caution { border-left: 4px solid #d9a13b; padding-left: 15px; }

  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
  }
  .card-title { font-size: 16.5px; font-weight: 600; }
  .card-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .pill-green { background: var(--green-soft); color: var(--green); border-color: #cfe6d5; }
  .pill-amber { background: var(--amber-soft); color: var(--amber); border-color: #f0dcb8; }
  .pill-red { background: var(--red-soft); color: var(--red); border-color: #f6cfcb; }
  .pill-gray { background: var(--gray-soft); color: var(--text-soft); border-color: var(--border); }
  .pill-blue { background: var(--accent-soft); color: #243a8a; border-color: #d6e0fb; }

  .card-body {
    margin-top: 14px;
    display: grid;
    gap: 10px;
  }
  .progress-row { display: flex; align-items: center; gap: 10px; }
  .progress {
    flex: 1 1 auto;
    height: 8px;
    border-radius: 999px;
    background: var(--gray-soft);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
    transition: width 200ms ease;
  }
  .progress-value {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--text-soft);
    min-width: 42px;
    text-align: right;
  }
  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    font-size: 12.5px;
    color: var(--text-soft);
  }
  .meta-item { display: flex; flex-direction: column; gap: 1px; }
  .meta-label { color: var(--muted); font-size: 11.5px; }
  .meta-value { font-variant-numeric: tabular-nums; }
  .is-overdue { color: var(--red); font-weight: 600; }
  .is-soon { color: var(--amber); font-weight: 600; }

  .task-counts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .task-counts strong { color: var(--text-soft); font-weight: 600; }

  /* ---------- empty / skeleton / error ---------- */
  .state {
    background: var(--surface);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align: center;
    color: var(--text-soft);
  }
  .state h3 { font-size: 16px; margin-bottom: 6px; }
  .state p { font-size: 13.5px; color: var(--muted); }
  .state-error { border-style: solid; border-color: #f6cfcb; background: var(--red-soft); color: #7d1a15; }

  .skeleton-list { display: grid; gap: 12px; }
  .skeleton-card {
    height: 132px;
    border-radius: var(--radius);
    background: linear-gradient(90deg, #f1f2f5 25%, #f8f9fb 37%, #f1f2f5 63%);
    background-size: 400% 100%;
    animation: shimmer 1.3s ease infinite;
  }
  @keyframes shimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .skeleton-card { animation: none; }
    .project-card, .progress-fill { transition: none; }
  }

  /* ---------- detail ---------- */
  .back-button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: var(--tap);
    padding: 0 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--surface);
    cursor: pointer;
  }
  .detail-head {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin: 14px 0 16px;
  }
  .detail-title { font-size: 22px; line-height: 1.35; }
  .detail-summary {
    margin-top: 10px;
    font-size: 14px;
    color: var(--text-soft);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .detail-facts {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }
  .fact-label { font-size: 11.5px; color: var(--muted); }
  .fact-value { font-size: 14px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

  .group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .group > summary {
    cursor: pointer;
    padding: 14px 18px;
    min-height: var(--tap);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    list-style: none;
    font-weight: 600;
  }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before {
    content: "▸";
    color: var(--muted);
    margin-right: 8px;
    transition: transform 120ms ease;
    display: inline-block;
  }
  .group[open] > summary::before { transform: rotate(90deg); }
  .group-summary-main { display: flex; align-items: baseline; gap: 10px; flex: 1 1 auto; min-width: 0; }
  .group-name { overflow-wrap: anywhere; }
  .group-meta { font-size: 12.5px; color: var(--muted); font-weight: 400; }
  .group-body { border-top: 1px solid var(--border); }

  .table-scroll { width: 100%; overflow-x: auto; }
  table.task-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  .task-table caption { text-align: left; padding: 10px 18px; color: var(--muted); font-size: 12.5px; }
  .task-table th {
    text-align: left;
    font-weight: 600;
    font-size: 11.5px;
    color: var(--muted);
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-soft);
    white-space: nowrap;
  }
  .task-table th button {
    border: 0;
    background: none;
    padding: 0;
    cursor: pointer;
    color: inherit;
    font: inherit;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .task-table td {
    padding: 11px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .task-table tbody tr:last-child td { border-bottom: 0; }
  .task-table tbody tr:hover { background: var(--surface-soft); }
  .task-name-button {
    border: 0;
    background: none;
    padding: 2px 0;
    text-align: left;
    color: var(--text);
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: transparent;
    text-underline-offset: 3px;
  }
  .task-name-button:hover { text-decoration-color: var(--accent); color: var(--accent); }
  .cell-label { display: none; }
  .cell-remaining { white-space: nowrap; }
  .cell-progress { display: flex; align-items: center; gap: 8px; min-width: 110px; }

  .milestone-list { display: grid; gap: 8px; }
  .milestone {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 13.5px;
  }

  /* ---------- drawer ---------- */
  .drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(16, 24, 40, 0.32);
    z-index: 40;
  }
  .drawer {
    position: fixed;
    z-index: 50;
    top: 0;
    right: 0;
    height: 100%;
    width: min(460px, 100%);
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: -12px 0 40px rgba(16, 24, 40, 0.12);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .drawer-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--surface);
  }
  .drawer-title { font-size: 17px; line-height: 1.4; overflow-wrap: anywhere; }
  .drawer-close {
    border: 1px solid var(--border-strong);
    background: var(--surface);
    border-radius: var(--radius-sm);
    min-width: var(--tap);
    min-height: var(--tap);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
  }
  .drawer-body { padding: 18px 20px 40px; display: grid; gap: 16px; }
  .drawer-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .note {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 13.5px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .readonly-badge {
    font-size: 11.5px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
    white-space: nowrap;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: #232935;
    color: #fff;
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 13px;
    z-index: 60;
    max-width: min(90vw, 520px);
    text-align: center;
  }

  /* ---------- responsive ---------- */
  @media (min-width: 720px) {
    .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .project-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .detail-facts { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .drawer-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (min-width: 1140px) {
    .project-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  @media (max-width: 640px) {
    body { font-size: 14.5px; }
    .shell { padding: 0 14px 56px; }
    .topbar-inner { padding: 14px 14px; }
    .brand-title { font-size: 16px; }
    .filters { width: 100%; }
    .filter { flex: 1 1 46%; }
    .filter select { max-width: none; width: 100%; }
    .detail-head { padding: 18px; }
    .detail-title { font-size: 19px; }

    /* Cards instead of a table on small screens, without losing the real table semantics. */
    .task-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .task-table, .task-table tbody, .task-table tr, .task-table td { display: block; width: 100%; }
    .task-table tr {
      border-bottom: 1px solid var(--border);
      padding: 10px 14px 12px;
    }
    .task-table tbody tr:last-child { border-bottom: 0; }
    .task-table td {
      border: 0;
      padding: 3px 0;
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
    }
    .cell-label {
      display: block;
      font-size: 11px;
      color: var(--muted);
    }
    .task-table td.cell-primary {
      display: block;
      padding-bottom: 8px;
      font-size: 14.5px;
    }
    .task-table td.cell-primary .cell-label { margin-bottom: 2px; }
    .drawer { width: 100%; border-left: 0; }
  }
</style>
