  // the existing manager sidebar and domain workflow.
  if(d.type==='task')fields.appendChild(el('p',t('durationHint'),'muted hint-wide'));
  var confirms=d.type==='project'?['confirmDeadlineChange','confirmResponsibilityChange','confirmRetiredResponsibility']:d.type==='subproject'?['confirmReparent']:d.type==='task'?['acknowledgeNonWorking','confirmDeadlineChange']:[];
  confirms.forEach(function(k){field(fields,k,d.values[k],null,function(v){d.values[k]=v;},'checkbox');});
  if(d.type==='task')button('plan',function(){api.read('plan',d.values,true).then(function(p){message.textContent=t('plannedStart')+': '+p.startDate+' · '+p.warnings.map(function(w){return EH_I18N.has('web.'+w.code)?t(w.code):EH_I18N.serverMessage(lang,w.code);}).join(', ');}).catch(function(e){message.textContent=e.message;});},form);
  var languageButton=el('button','日本語 | English');languageButton.type='button';languageButton.addEventListener('click',switchLanguage);form.appendChild(languageButton);
  var actions=el('div',undefined,'toolbar'),save=el('button',t('save'),'primary');save.type='submit';save.disabled=!!d.saving;actions.appendChild(save);
  button('close',function(){byId('editor').close();},actions);
  button('discard',function(){if(window.confirm(t('confirm'))){drafts.delete(currentEditor.key);currentEditor=null;byId('editor').close();}},actions);
  if(d.id&&(d.type==='project'||d.type==='task'))button('reloadDraft',function(){api.read(d.type,{id:d.id},true).then(function(result){message.replaceChildren(el('p',t('draft')));structured(result.record,message);button('useLatest',function(){if(window.confirm(t('confirm'))){drafts.delete(currentEditor.key);byId('editor').close();openEditor(d.type,d.id,result.record);}},message);});},actions);
  if(d.type==='task'&&d.id)['taskApprove','taskConfirm'].forEach(function(a){button(a,function(){act(a,{taskId:d.id,revision:d.original._revision},true).then(function(ok){if(ok)api.read('task',{id:d.id},true).then(function(r){d.original=r.record;d.original._confirmations=r.confirmations;renderEditor();});});},actions);});
  form.appendChild(actions);form.addEventListener('submit',function(e){e.preventDefault();if(d.saving)return;var savedKey=currentEditor.key;var payload={};Object.keys(schema.fields).forEach(function(k){if(k==='role'&&actorRole!=='ADMIN')return;if(d.id&&String(d.values[k])===String(d.base[k]))return;var target=k==='statusField'?'status':k==='enabled'?'active':k;payload[target]=d.values[k];});confirms.forEach(function(k){payload[k]=d.values[k]===true;});if(d.id){payload[schema.key]=d.id;payload.revision=d.original._revision;}if(d.type==='task'){payload.deadline=d.values.deadline;payload.durationValue=d.values.durationValue;payload.durationUnit=d.values.durationUnit;payload.durationBasis=d.values.durationBasis;}
    d.saving=true;save.disabled=true;message.textContent=t('saving');
    api.write(d.id?schema.save:schema.create,payload).then(function(result){drafts.delete(savedKey);if(currentEditor&&currentEditor.draft===d){currentEditor=null;byId('editor').close();}settle(d.id?schema.save:schema.create,payload,result);success(t('saved'));}).catch(function(error){message.textContent=error.message;message.className='error';}).finally(function(){d.saving=false;save.disabled=false;});
  });host.appendChild(form);
}
function switchLanguage(){lang=EH_I18N.write(lang==='ja'?'en':'ja');renderNav();render();if(currentEditor)renderEditor();}
byId('language').addEventListener('click',switchLanguage);
byId('navToggle').addEventListener('click',function(){var hidden=document.body.classList.toggle('collapsed');byId('navToggle').setAttribute('aria-expanded',String(!hidden));});
if(byId('diagnostics'))byId('diagnostics').addEventListener('click',function(){navigate('diagnostics');});
window.addEventListener('focus',revalidateCurrent);
if(typeof document.addEventListener==='function')document.addEventListener('visibilitychange',function(){if(document.hidden!==true)revalidateCurrent();});
window.addEventListener('beforeunload',function(e){if(pending.size||Array.from(drafts.values()).some(function(d){return d.dirty||d.note;})){e.preventDefault();e.returnValue='';}});
metrics.push({operation:'shell',renderMs:performance.now()});load(false);
}());
</script>
