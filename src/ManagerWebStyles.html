<style>
/* V1.6 desktop design tokens. System fonts first, web fonts only as a fallback. */
:root{
  --v16-bg:#f4f6f8;--v16-surface:#ffffff;--v16-text:#27333e;--v16-text-soft:#526170;--v16-border:#d7dee5;
  --v16-nav:#304e70;--v16-accent:#357c9b;--v16-automation:#6a65a8;--v16-done:#328568;--v16-pending:#c38a39;--v16-critical:#a74646;
  --v16-font:"Noto Sans JP","Inter","Yu Gothic UI","Meiryo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
body{background:var(--v16-bg);color:var(--v16-text);font-family:var(--v16-font)}
nav{background:var(--v16-surface)}
.nav-section{margin:0 0 10px;font-size:12.5px;letter-spacing:.04em;text-transform:none;color:var(--v16-text-soft);font-weight:600}
.area-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin:0 0 20px}
.area-card{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--v16-surface);border:1px solid var(--v16-border);border-left:6px solid var(--v16-accent);border-radius:8px;padding:14px 16px;cursor:pointer;min-height:44px}
.area-card:hover{background:#f7fafc}
.area-card[aria-pressed=true]{box-shadow:0 0 0 2px var(--v16-nav) inset;border-color:var(--v16-nav)}
.area-card .area-name{font-size:17px;font-weight:700}
.area-card .area-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--v16-text-soft)}
.area-card .area-metric strong{font-variant-numeric:tabular-nums;color:var(--v16-text)}
.area-card.is-overdue .area-overdue{color:var(--v16-critical);font-weight:600}
.area-card .area-progress{height:6px;border-radius:999px;background:#e6ebf0;overflow:hidden}
.area-card .area-progress>span{display:block;height:100%;background:var(--v16-accent)}
.area-add{border-style:dashed;border-left-width:1px;color:var(--v16-nav);font-weight:600}
.section-title{display:flex;align-items:baseline;gap:12px;margin:24px 0 10px}
.section-title h2{margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:600;background:#eef1f4;color:var(--v16-text-soft);border:1px solid var(--v16-border)}
.chip-dot{width:10px;height:10px;border-radius:50%;background:var(--v16-accent)}
.chip-review{background:#fbf3e6;color:#8c5a15;border-color:#f0dcb8}
.chip-review.is-stale{background:#f9eceb;color:var(--v16-critical);border-color:#f6cfcb}
.chip-container{background:#eaf4ed;color:#287348;border-color:#cfe6d5}
.task-card.task-nested{margin-left:22px;border-left-width:3px}
.task-card.task-depth-2{margin-left:44px}
.task-card.task-depth-3{margin-left:66px}
.task-branch{color:var(--v16-text-soft);margin-right:6px}
.deletion-panel{border:1px solid var(--v16-critical);border-radius:8px;padding:14px;background:#fff7f6;margin:12px 0}
.deletion-panel h3{margin:0 0 8px;color:var(--v16-critical)}
.deletion-panel ul{margin:6px 0 10px;padding-left:20px}
/* The narrower navigation column applies only between the mobile collapse (900 px) and this
   width; below 900 px the layout stacks instead of squeezing the content into a side column. */
@media(min-width:901px) and (max-width:1100px){.layout{grid-template-columns:200px minmax(0,1fr)}}
/* V1.6.2 responsibility colour picker. Selection is state (aria-pressed plus a check mark),
   never colour alone; the HEX field stays an optional advanced control. */
.color-field{display:flex;flex-direction:column;gap:10px;border:1px solid var(--v16-border);border-radius:8px;padding:14px;background:var(--v16-surface)}
.color-legend{font-weight:600}
.color-swatches{display:flex;flex-wrap:wrap;gap:10px}
.color-swatch{position:relative;width:44px;height:44px;min-height:44px;padding:0;border:2px solid transparent;border-radius:8px;color:#fff;font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.color-swatch[aria-pressed=true]{border-color:var(--v16-text);box-shadow:0 0 0 2px var(--v16-surface) inset}
.color-swatch .color-check{visibility:hidden;font-weight:700}
.color-swatch[aria-pressed=true] .color-check{visibility:visible}
.color-custom{display:flex;flex-direction:column;gap:6px;max-width:220px}
.color-custom input[type=color]{width:100%;height:44px;padding:2px;background:var(--v16-surface)}
.color-advanced summary{cursor:pointer;color:var(--v16-text-soft);padding:4px 0}
.color-advanced label{margin-top:6px}
.color-error{display:block;color:var(--v16-critical);margin-top:4px;min-height:18px}
.color-preview{display:flex;flex-direction:column;gap:4px;border:1px solid var(--v16-border);border-left:6px solid var(--v16-accent);border-radius:8px;padding:10px 14px;background:var(--v16-surface)}
.color-preview-name{font-weight:700}
.color-preview-meta{font-size:13px;color:var(--v16-text-soft);font-variant-numeric:tabular-nums}
.color-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--v16-accent)}
.color-chip{gap:2px}
/* V1.7 additional members, shared-assignment chips and the Yes/No deletion confirmation. */
.member-multiselect{display:flex;flex-direction:column;gap:6px;border:1px solid var(--v16-border);border-radius:8px;padding:10px 12px;background:var(--v16-surface)}
.member-multiselect label{display:flex;flex-direction:column;gap:4px;font-weight:600}
.member-multiselect select{min-height:120px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.member-chip{display:inline-flex;align-items:center;gap:6px;background:var(--v16-surface-alt,#eef2f5);border-radius:999px;padding:2px 10px}
.member-chip button{border:0;background:transparent;color:var(--v16-text-soft);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.chip-shared{background:#eef2f5;color:var(--v16-text-soft)}
.deletion-confirm{border:1px solid var(--v16-border);border-radius:12px;padding:18px 22px;max-width:460px;background:#fff}
.deletion-confirm::backdrop{background:rgba(20,28,36,.45)}
.deletion-confirm .toolbar{display:flex;gap:8px;margin-top:14px}
@media (max-width:640px){.member-multiselect select{min-height:96px}}
/* V1.7.2 administration layout: publication and system-status cards, grouped settings and the
   searchable hierarchy controls. Cards keep one alignment, badges carry text as well as colour,
   and no panel introduces horizontal scrolling. */
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin:0 0 16px;align-items:stretch}
.admin-card{display:flex;flex-direction:column;gap:10px;margin:0;min-width:0}
.admin-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.admin-card-head h2{margin:0;font-size:18px}
.admin-card .meta{margin:0;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
.admin-card .meta-item{min-width:0}
.admin-card-error{border-color:var(--v16-critical)}
.admin-card-emergency{border-left:6px solid var(--v16-critical)}
.admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.admin-details{border:1px solid var(--v16-border);border-radius:8px;background:var(--v16-surface);padding:10px 16px;margin:0 0 12px}
.admin-details summary{cursor:pointer;color:var(--v16-text-soft);font-weight:600;padding:4px 0}
.admin-details .meta{margin-top:10px}
.info-banner{display:flex;flex-direction:column;gap:6px;border:1px solid #cfe6d5;background:#eaf4ed;border-radius:8px;padding:12px 16px;margin:0 0 16px}
.info-banner p{margin:0;overflow-wrap:anywhere}
.info-banner.is-warn{border-color:#f0dcb8;background:#fbf3e6}
.settings-group{display:flex;flex-direction:column;gap:12px;margin:0 0 16px}
.settings-group h3{margin:0}
.settings-group .fields{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.settings-save-row{position:sticky;bottom:0;background:var(--v16-surface);border-top:1px solid var(--v16-border);padding:12px 0;margin:0 0 8px}
.setting{display:flex;flex-direction:column;gap:6px;min-width:0}
.search-select{display:flex;flex-direction:column;gap:6px;border:1px solid var(--v16-border);border-radius:8px;padding:10px 12px;background:var(--v16-surface);min-width:0}
.search-select label{display:flex;flex-direction:column;gap:4px;font-weight:600}
.search-select select{min-height:44px}
.search-select-echo{margin:0;font-size:13px;overflow-wrap:anywhere}
@media (max-width:640px){.admin-grid{grid-template-columns:1fr}.admin-actions button{flex:1 1 auto}}
</style>
