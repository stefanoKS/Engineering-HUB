<style>
:root{color-scheme:light;font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;color:#27333e;background:#f4f6f8;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button,input,select{min-height:44px}button{border:1px solid #6a7b88;border-radius:6px;background:white;padding:8px 14px;cursor:pointer}button:hover{background:#eaf0f4}button:disabled{opacity:.6;cursor:wait}button.primary{background:#365f7d;color:white}input,select,textarea{width:100%;max-width:100%;border:1px solid #6a7b88;border-radius:5px;padding:9px;background:white}textarea{min-height:96px;resize:vertical}input[type=checkbox]{width:22px;min-height:22px;vertical-align:middle}header{min-height:72px;display:flex;align-items:center;gap:16px;padding:12px 24px;background:white;border-bottom:1px solid #d7dee5;flex-wrap:wrap}header strong{font-size:20px}#actor{margin-left:auto;color:#526170}.version{font-size:14px;color:#526170}.layout{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:calc(100vh - 72px)}nav{padding:24px 12px;border-right:1px solid #d7dee5;background:white}nav button{display:block;width:100%;text-align:left;margin-bottom:8px;border-color:transparent}nav button[aria-current=page]{background:#e6edf2;color:#244761;border-color:#365f7d}main{padding:28px;min-width:0;max-width:1600px;width:100%;margin:auto}h1{font-size:24px;margin:0 0 20px}h2{font-size:20px}h3{font-size:17px}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:16px 0}.toolbar label{flex:1 1 150px}.toolbar button{flex:0 1 auto}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card,.kpi{background:white;border:1px solid #d7dee5;border-radius:8px;padding:18px;margin-bottom:12px;overflow-wrap:anywhere}.kpi strong{display:block;font-size:30px;margin-top:12px}.muted{color:#526170}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.row>span{flex:1;min-width:100px}dl{display:grid;grid-template-columns:minmax(80px,1fr) minmax(0,2fr);gap:10px}dd{margin:0;overflow-wrap:anywhere}dt{color:#526170}.tree{border-left:2px solid #d7dee5;margin:12px 0;padding-left:16px}.tree.child{margin-left:28px}dialog{border:1px solid #6a7b88;border-radius:8px;width:min(760px,calc(100% - 24px));max-height:90vh;padding:24px;color:#27333e}dialog::backdrop{background:#27333e80}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:block;min-width:0;overflow-wrap:anywhere}label>span{display:block;margin-bottom:6px}form .toolbar{position:sticky;bottom:-24px;background:white;padding:12px 0;margin-bottom:0}.error{color:#a83e3a;border-left:4px solid #a83e3a;padding:12px;background:#fff5f3}.success{color:#287348;padding:12px}.skip{position:absolute;left:12px;top:-100px;background:white;padding:12px;z-index:10}.skip:focus{top:8px}:focus-visible{outline:3px solid #365f7d;outline-offset:3px}body.collapsed .layout{grid-template-columns:1fr}body.collapsed nav{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}#notice{min-height:28px;margin-bottom:8px}@media(max-width:900px){.layout{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap;padding:10px;gap:6px;border-right:0;border-bottom:1px solid #d7dee5}nav button{width:auto;margin:0;flex:1}main{padding:20px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){header{padding:12px;gap:10px}header strong{font-size:18px}#actor{margin:0}.fields{grid-template-columns:1fr}main{padding:14px}.kpis{gap:8px}.kpi{padding:12px}dialog{padding:16px}.toolbar{align-items:stretch}.toolbar button{flex:1 1 120px}nav button{padding:8px;font-size:14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.progress-row{display:flex;align-items:center;gap:10px;margin:12px 0 4px}.progress{flex:1 1 auto;height:8px;border-radius:999px;background:#e6ebf0;overflow:hidden}.progress-fill{height:100%;border-radius:999px;background:#365f7d;transition:width 200ms ease}.progress-value{font-size:13px;font-variant-numeric:tabular-nums;color:#526170;min-width:48px;text-align:right}.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin:12px 0}.meta-item{display:flex;flex-direction:column;gap:1px;min-width:112px}.meta-label{font-size:12.5px;color:#526170}.meta-value{font-variant-numeric:tabular-nums}.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid transparent;white-space:nowrap}.pill-green{background:#eaf4ed;color:#287348;border-color:#cfe6d5}.pill-amber{background:#fbf3e6;color:#8c5a15;border-color:#f0dcb8}.pill-red{background:#f9eceb;color:#a83e3a;border-color:#f6cfcb}.pill-gray{background:#eef1f4;color:#526170;border-color:#d7dee5}.is-overdue{color:#a83e3a;font-weight:600}.is-soon{color:#8c5a15;font-weight:600}.hint-wide{grid-column:1/-1;margin:0}
