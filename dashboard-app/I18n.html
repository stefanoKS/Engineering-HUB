  function normalize(lang) {
    var value = String(lang || '').toLowerCase();
    return LANGUAGES.indexOf(value) >= 0 ? value : DEFAULT_LANGUAGE;
  }

  function format(template, vars) {
    if (!vars) return template;
    return String(template).replace(/\{(\w+)\}/g, function (match, name) {
      return Object.prototype.hasOwnProperty.call(vars, name) ? String(vars[name]) : match;
    });
  }

  function t(lang, key, vars) {

    var table = DICTIONARY[language] || DICTIONARY[DEFAULT_LANGUAGE];
    var value = table[key];
    if (value === undefined || value === null) {
      var fallback = DICTIONARY[DEFAULT_LANGUAGE][key];
      value = fallback === undefined || fallback === null ? key : fallback;
    }
    return format(value, vars);
  }

    return Object.prototype.hasOwnProperty.call(DICTIONARY[DEFAULT_LANGUAGE], key);
  }

    var key = group + '.' + String(value === undefined || value === null ? '' : value);
    return has(key) ? t(lang, key) : String(value === undefined || value === null ? '' : value);
  }

  /** Deadline wording from the neutral {kind, days} pair returned by the server. */
  function deadline(lang, kind, days, completed) {
    if (completed || kind === 'done') return t(lang, 'deadline.done');
    if (kind === 'today') return t(lang, 'deadline.today');
    if (kind === 'overdue') {
      var late = Math.abs(Number(days) || 0);
      return t(lang, late === 1 ? 'deadline.overdueOne' : 'deadline.overdue', {days: late});
    }
    if (kind === 'future') {
      var left = Number(days) || 0;
      return t(lang, left === 1 ? 'deadline.futureOne' : 'deadline.future', {days: left});
    }
    return t(lang, 'deadline.none');
  }

  function serverMessage(lang, message) {
    var text = String(message === undefined || message === null ? '' : message);
    if (normalize(lang) === DEFAULT_LANGUAGE) return text;
    return Object.prototype.hasOwnProperty.call(SERVER_MESSAGES, text) ? SERVER_MESSAGES[text] : text;
  }

  function errorMessage(lang, error) {
    var code = error && error.code ? String(error.code) : '';
    if (code && has('request.error.' + code)) return t(lang, 'request.error.' + code);
    return serverMessage(lang, error && error.message ? error.message : '');
  }

  function store() {
    try {
      return typeof localStorage === 'undefined' ? null : localStorage;
    } catch (error) {
      return null;
    }
  }

  function read() {
    var storage = store();
    if (!storage) return DEFAULT_LANGUAGE;
    try {
      return normalize(storage.getItem(STORAGE_KEY));
    } catch (error) {

    }

    }
    return value;

   * every node carrying data-i18n / data-i18n-aria / data-i18n-title.

    each('[data-i18n-aria]', 'data-i18n-aria');
    each('[data-i18n-title]', 'data-i18n-title');

      var key = node.getAttribute('data-i18n-placeholder');
      if (key) node.setAttribute('placeholder', t(language, key));
    });

  }

    APP_NAME: APP_NAME,
    DEFAULT_LANGUAGE: DEFAULT_LANGUAGE,
    LANGUAGES: LANGUAGES,
    STORAGE_KEY: STORAGE_KEY,
    DICTIONARY: DICTIONARY,
    SERVER_MESSAGES: SERVER_MESSAGES,
    normalize: normalize,
