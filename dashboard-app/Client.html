<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   * Browser-side dashboard controller.
   *
   * Rules enforced here (and checked by `npm run validate`):
   * - Every stored string is inserted with textContent or DOM creation. There is no
   *   markup-string assignment path (the forbidden DOM APIs are rejected by validation),
   *   so spreadsheet text can never become markup.
   * - Stored text (project, task and member names, notes, request explanations) is never
   *   translated: only static labels and controlled enum labels come from the dictionary.
   * - Responses carry a request token, so a slow answer for an older search or project
   *   cannot overwrite a newer selection.
   * - The only write calls are the validated request submissions; the dashboard never
   *   updates operational rows.
   * ------------------------------------------------------------------ */

  var I18n = window.EH_I18N;
  var language = I18n.read();

  function T(key, vars) { return I18n.t(language, key, vars); }
  function statusText(value) { return I18n.label(language, 'status', value); }
  function healthText(value) { return I18n.label(language, 'health', value); }
  function priorityText(value) { return I18n.label(language, 'priority', value); }
  function deadlineText(item) {
    return I18n.deadline(language, item.deadlineKind, item.daysRemaining, item.status === 'Done');
  }
  function unset(value) { return value === '' || value === null || value === undefined ? T('common.unset') : String(value); }

  var RISK_ORDER = {RED: 0, YELLOW: 1, UNKNOWN: 2};
  var SEARCH_DEBOUNCE_MS = 280;
  var PRIORITY_RANK = {Critical: 4, High: 3, Medium: 2, Low: 1};
  var CLIENT_TOKEN_KEY = 'eh.requestToken';

  // Canonical stored reason values (Japanese) with their translation keys. The stored value
  // is never translated; only the label shown in the form is localized.
  var REASONS = [
    {value: '部品・材料の納期遅延', key: 'request.reason.parts'},
    {value: '技術的問題', key: 'request.reason.technical'},
    {value: '工数不足・他業務', key: 'request.reason.capacity'},
    {value: '仕様変更', key: 'request.reason.spec'},
    {value: '工程間の依存関係', key: 'request.reason.dependency'},
    {value: 'その他', key: 'request.reason.other'}
  ];

  var state = {
    projects: [],
    meta: null,
    indicators: null,
    filterOptions: null,
    requestToken: 0,
    detailToken: 0,
    drawerToken: 0,
    query: '',
    filters: {status: 'open', responsibility: '', category: '', owner: '', risk: '', dueSoon: false},
    detail: null,
    currentProjectId: '',
    taskSort: {key: 'due', direction: 1},
    drawerOpen: false,
    drawerData: null,
    lastFocused: null,
    // 'loading' | 'enabled' | 'disabled' | 'error'. Fail closed until the server answers.
    requestConfig: {enabled: false, state: 'loading'},
    // Unsent request form data lives in memory only: a language switch, a validation error
    // or a temporary server error must never discard what the viewer typed.
    draft: {taskId: '', type: '', fields: {}, lookup: '', receipt: null, statusResult: null},
    // V1.7 worker view and the non-blocking submission activity list.
    view: 'portfolio',
    worker: {worker: '', responsibilityId: '', projectId: '', group: 'open', priority: '',
      overdue: false, dueWithin: false, query: '', offset: 0},
    workerData: null,
    workerToken: 0
  };

  /* ---------------- non-blocking request submission ---------------- */

  /**
   * Transport state of one submission. This is deliberately separate from the manager's
   * approval state: RECEIVED means the inbox accepted the row, never that it was approved.
   *
   * Only non-sensitive receipt metadata is persisted (task id, type, time, state, request ID).
   * Explanation text, completion notes and any manager data stay in memory and are lost on
   * reload by design.
   */
  var SUBMISSION_KEY = 'eh.submissions';
  var MAX_SUBMISSION_RECORDS = 20;
  var submissions = [];

  function storage() { return typeof localStorage === 'undefined' ? null : localStorage; }

  function readSubmissions() {
    try {
      var raw = storage().getItem(SUBMISSION_KEY);
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (error) { return []; }
  }

  function persistSubmissions() {
    try {
      // Only the allowlisted receipt metadata is stored; request text is never persisted.
      var safe = submissions.map(function (entry) {
        return {attemptId: entry.attemptId, type: entry.type, taskId: entry.taskId,
          taskName: entry.taskName, at: entry.at, transport: entry.transport,
          requestId: entry.requestId, serverStatus: entry.serverStatus || ''};
      });
      storage().setItem(SUBMISSION_KEY, JSON.stringify(safe.slice(-MAX_SUBMISSION_RECORDS)));
    } catch (error) { /* storage is an optimisation; the in-memory list stays authoritative */ }
  }

  function newAttemptId() {
    return 'A-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  /**
   * Loads the stored receipts and reports an interrupted send honestly.
   *
   * A record left in SENDING means the browser could not observe the answer. It may have been
   * stored in the inbox or not, so it becomes OUTCOME_UNKNOWN instead of being retried.
   */
  function loadSubmissions() {
    submissions = readSubmissions().map(function (entry) {
      var record = Object.assign({}, entry);
      if (record.transport === 'SENDING' || record.transport === 'LOCAL_PENDING') record.transport = 'OUTCOME_UNKNOWN';
      return record;
    });
    persistSubmissions();
  }

  function findSubmission(attemptId) {
    return submissions.filter(function (entry) { return entry.attemptId === attemptId; })[0] || null;
  }

  /**
   * Sends one request without blocking the interface.
   *
   * The caller closes the form immediately; this controller owns the RPC, the durable receipt
   * and the failure state. A retry reuses the same browser token, so the server's existing
   * duplicate guard returns the original request ID instead of creating a second request.
   */
  function startSubmission(type, payload, meta) {
    var entry = {
      attemptId: newAttemptId(), type: type, taskId: String(payload.taskId || ''),
      taskName: String((meta && meta.taskName) || ''), at: new Date().toISOString(),
      transport: 'SENDING', requestId: '', error: '',
      // Kept in memory only so a retry in this page can re-send the exact same request.
      payload: payload
    };
    submissions.push(entry);
    persistSubmissions();
    renderActivity();
    var call = type === 'DEADLINE_CHANGE' ? api.submitDeadline : api.submitCompletion;
    return call(payload).then(function (result) {
      if (result && result.ok) {
        entry.transport = 'RECEIVED';
        entry.requestId = String((result.data && result.data.requestId) || '');
        entry.serverStatus = String((result.data && result.data.status) || 'RECEIVED');
      } else {
        entry.transport = 'FAILED';
        entry.error = I18n.errorMessage(language, result && result.error);
      }
      persistSubmissions(); renderActivity();
      return entry;
    }).catch(function (error) {
      // A transport failure is ambiguous: the inbox row may or may not exist.
      entry.transport = 'OUTCOME_UNKNOWN';
      entry.error = String((error && error.message) || error || '');
      persistSubmissions(); renderActivity();
      return entry;
    });
  }

  function transportLabel(value) {
    var key = 'request.transport.' + String(value || '');
    return I18n.has(key) ? T(key) : String(value || '');
  }

  function renderActivity() {
    if (!dom.activity || !dom.activityList) return;
    clear(dom.activityList);
    if (!submissions.length) { dom.activity.hidden = true; return; }
    dom.activity.hidden = false;
    submissions.slice().reverse().forEach(function (entry) {
      var item = el('li', {className: 'request-activity-item'});
      item.appendChild(el('strong', {text: entry.taskName || entry.taskId}));
      var facts = el('dl');
      facts.appendChild(el('dt', {text: T('request.activity.type.' + entry.type)}));
      facts.appendChild(el('dd', {text: transportLabel(entry.transport)}));
      facts.appendChild(el('dt', {text: T('request.activity.at')}));
      facts.appendChild(el('dd', {text: String(entry.at || '').replace('T', ' ').slice(0, 16)}));
      if (entry.requestId) {
        facts.appendChild(el('dt', {text: T('request.confirm.id')}));
        facts.appendChild(el('dd', {text: entry.requestId}));
      }
      if (entry.serverStatus) {
        facts.appendChild(el('dt', {text: T('request.activity.approval')}));
        facts.appendChild(el('dd', {text: I18n.t(language, 'request.status.' + entry.serverStatus)}));
      }
      item.appendChild(facts);
      if (entry.error) item.appendChild(el('p', {className: 'request-error', text: entry.error}));
      if (entry.transport === 'OUTCOME_UNKNOWN') item.appendChild(el('p', {className: 'request-hint', text: T('request.activity.outcomeUnknown')}));
      var actions = el('div', {className: 'request-actions'});
      if (entry.requestId) {
        actions.appendChild(el('button', {className: 'request-button', attrs: {type: 'button'}, text: T('request.activity.check')}))
          .addEventListener('click', function () { checkSubmission(entry); });
      }
      if (entry.transport === 'FAILED' && entry.requestId) {
        actions.appendChild(el('button', {className: 'request-button', attrs: {type: 'button'}, text: T('request.activity.retry')}))
          .addEventListener('click', function () { retrySubmission(entry); });
      }
      actions.appendChild(el('button', {className: 'request-button', attrs: {type: 'button'}, text: T('request.activity.dismiss')}))
        .addEventListener('click', function () {
          submissions = submissions.filter(function (item2) { return item2.attemptId !== entry.attemptId; });
          persistSubmissions(); renderActivity();
        });
      item.appendChild(actions);
      dom.activityList.appendChild(item);
    });
  }

  /** Reads the authoritative inbox state of one receipt; never changes the request. */
  function checkSubmission(entry) {
    api.requestStatus(entry.requestId).then(function (result) {
      if (!result || !result.ok) {
        toast(I18n.errorMessage(language, result && result.error));
        return;
      }
      entry.serverStatus = String((result.data && result.data.status) || '');
      persistSubmissions(); renderActivity();
      toast(I18n.t(language, 'request.status.' + entry.serverStatus));
    }).catch(function () { toast(T('request.error.REQUEST_UNEXPECTED')); });
  }

  /**
   * Re-sends a request whose acknowledgement was lost *and* whose receipt is unknown.
   *
   * The browser reuses the same client token, so the server returns the original request ID
   * when the row already exists. The attempt is never sent twice concurrently.
   */
  function retrySubmission(entry) {
    if (entry.transport === 'SENDING' || !entry.payload) {
      toast(T('request.activity.outcomeUnknown'));
      return;
    }
    var payload = entry.payload;
    var type = entry.type;
    submissions = submissions.filter(function (item) { return item.attemptId !== entry.attemptId; });
    persistSubmissions(); renderActivity();
    startSubmission(type, payload, {taskName: entry.taskName}).then(function (result) {
      if (result.transport === 'RECEIVED') toast(T('request.transport.RECEIVED'));
      else if (result.transport === 'FAILED') toast(result.error || T('request.transport.FAILED'));
      else toast(T('request.activity.outcomeUnknown'));
    });
  }

  /* ---------------- DOM helpers ---------------- */

  function el(tag, options, children) {
    var node = document.createElement(tag);
    options = options || {};
    if (options.className) node.className = options.className;
    if (options.text !== undefined && options.text !== null) node.textContent = String(options.text);
    if (options.id) node.id = options.id;
    if (options.attrs) {
      Object.keys(options.attrs).forEach(function (name) {
        var value = options.attrs[name];
        if (value === null || value === undefined || value === false) return;
        node.setAttribute(name, value === true ? 'true' : String(value));
      });
    }
    (children || []).forEach(function (child) { if (child) node.appendChild(child); });
    return node;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function byId(id) { return document.getElementById(id); }

  /**
   * V1.7.4: the accent of a project is derived by the shared `EH_PROJECT_COLORS` helper from the
   * stable Project_ID (the published payload already carries it), never from a list position or
   * a filter state. Only palette values are returned, so an identifier never reaches a CSS colour.
   */
  function projectStyle(projectId) {
    return typeof EH_PROJECT_COLORS !== 'undefined' && EH_PROJECT_COLORS.styleFor
      ? EH_PROJECT_COLORS.styleFor(projectId) : '';
  }

  function withProjectAccent(node, projectId) {
    var style = projectStyle(projectId);
    if (node && style) node.setAttribute('style', style);
    return node;
  }

  var dom = {
    sync: byId('sync-info'),
    notices: byId('notices'),
    kpis: byId('kpis'),
    search: byId('search'),
    filterStatus: byId('filter-status'),
    filterResponsibility: byId('filter-responsibility'),
    filterCategory: byId('filter-category'),
    filterOwner: byId('filter-owner'),
    filterRisk: byId('filter-risk'),
    filterDue: byId('filter-due'),
    activeFilters: byId('active-filters'),
    reset: byId('reset-filters'),
    resultCount: byId('result-count'),
    overview: byId('overview'),
    loading: byId('overview-loading'),
    empty: byId('overview-empty'),
    emptyDetail: byId('overview-empty-detail'),
    error: byId('overview-error'),
    errorDetail: byId('overview-error-detail'),
    retry: byId('retry'),
    list: byId('project-list'),
    detail: byId('detail'),
    detailBack: byId('detail-back'),
    detailTitle: byId('detail-title'),
    detailSummary: byId('detail-summary'),
    detailHead: byId('detail-head'),
    detailFacts: byId('detail-facts'),
    detailCounts: byId('detail-counts'),
    detailNotice: byId('detail-notice'),
    detailGroups: byId('detail-groups'),
    detailEmpty: byId('detail-empty'),
    detailMilestones: byId('detail-milestones'),
    milestonesTitle: byId('detail-milestones-title'),
    drawer: byId('task-drawer'),
    drawerBody: byId('drawer-body'),
    drawerTitle: byId('task-drawer-title'),
    drawerBadge: byId('drawer-badge'),
    drawerClose: byId('drawer-close'),
    backdrop: byId('drawer-backdrop'),
    toast: byId('toast'),
    // V1.7 worker view and request activity.
    viewSwitch: byId('view-switch'),
    viewPortfolio: byId('view-portfolio'),
    viewWorkers: byId('view-workers'),
    workers: byId('workers'),
    workerWorker: byId('worker-worker'),
    workerResponsibility: byId('worker-responsibility'),
    workerProject: byId('worker-project'),
    workerGroup: byId('worker-group'),
    workerPriority: byId('worker-priority'),
    workerOverdue: byId('worker-overdue'),
    workerDue: byId('worker-due'),
    workerSearch: byId('worker-search'),
    workerCount: byId('worker-count'),
    workerEmpty: byId('worker-empty'),
    workerError: byId('worker-error'),
    workerErrorDetail: byId('worker-error-detail'),
    workerRetry: byId('worker-retry'),
    workerList: byId('worker-list'),
    workerPrev: byId('worker-prev'),
    workerNext: byId('worker-next'),
    activity: byId('request-activity'),
    activityList: byId('request-activity-list')
  };

  /* ---------------- server access ---------------- */

  function hasAppsScript() {
    return typeof google !== 'undefined' && google && google.script && google.script.run;
  }

  function callServer(name, args) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (error) { reject(error || new Error('server error')); })
        [name].apply(null, args || []);
    });
  }

  /**
   * A required list of a server payload.
   *
   * The dashboard never turns a broken contract into "no records": a missing or non-array list
   * raises, and the caller shows the error block instead of an empty portfolio.
   */
  function requireArray(value, field) {
    if (!Array.isArray(value)) throw new Error('INVALID_RESPONSE: expected array for ' + field);
    return value;
  }

  // Static offline preview (screenshots and local review only). In a deployed Apps Script
  // page `google.script.run` always exists, so this branch is unreachable there. The preview
  // reports submissions as enabled only so the request form can be reviewed; the real page
  // reads requestSubmissionConfig() and stays disabled unless the operator sets
  // REQUEST_SUBMISSION_ENABLED=true.
  var PREVIEW = (!hasAppsScript() && typeof window !== 'undefined' && window.__DASHBOARD_PREVIEW__) || null;

  var api = PREVIEW
    ? {
        portfolio: function (request) { return Promise.resolve(previewPortfolio(request)); },
        project: function (id) { return Promise.resolve(previewProject(id)); },
        task: function (projectId, taskId) { return Promise.resolve(previewTask(projectId, taskId)); },
        submitDeadline: function (payload) { return Promise.resolve(previewSubmit(payload, 'DEADLINE_CHANGE')); },
        submitCompletion: function (payload) { return Promise.resolve(previewSubmit(payload, 'COMPLETION_REPORT')); },
        requestStatus: function (id) { return Promise.resolve(previewStatus(id)); },
        requestConfig: function () { return Promise.resolve({ok: true, data: {enabled: true}}); },
        workerTasks: function (request) { return Promise.resolve(previewWorkerTasks(request)); }
      }
    : {
        portfolio: function (request) { return callServer('dashboardPortfolio', [request]); },
        project: function (id) { return callServer('dashboardProject', [id]); },
        task: function (projectId, taskId) { return callServer('dashboardTask', [projectId, taskId]); },
        submitDeadline: function (payload) { return callServer('submitDeadlineRequest', [payload]); },
        submitCompletion: function (payload) { return callServer('submitCompletionReport', [payload]); },
        requestStatus: function (id) { return callServer('requestSubmissionStatus', [id]); },
        requestConfig: function () { return callServer('requestSubmissionConfig', []); },
        workerTasks: function (request) { return callServer('dashboardWorkerTasks', [request]); }
      };

  /** Static preview only: the deployed page always reads the server query. */
  function previewWorkerTasks(request) {
    var source = (PREVIEW && PREVIEW.workerTasks) || {tasks: [], workers: [], projects: [], responsibilities: []};
    request = request || {};
    var worker = String(request.worker || '');
    var tasks = (source.tasks || []).filter(function (task) {
      if (!worker) return true;
      var names = task.assigneeNames || (task.ownerName ? [task.ownerName] : []);
      return names.indexOf(worker) >= 0;
    });
    return {ok: true, data: Object.assign({}, source, {tasks: tasks, total: tasks.length, offset: 0, limit: tasks.length || 20})};
  }

  function previewPortfolio(request) {
    var query = String((request && request.query) || '').toLowerCase();
    var projects = PREVIEW.portfolio.projects.filter(function (project) {
      if (!query) return true;
      return (project.projectName + ' ' + project.projectId).toLowerCase().indexOf(query) >= 0;
    });
    return {ok: true, data: Object.assign({}, PREVIEW.portfolio, {projects: projects, query: query})};
  }

  function previewProject(id) {
    var data = PREVIEW.projects[id];
    if (!data) return {ok: false, error: {code: 'NOT_FOUND', message: T('request.error.REQUEST_NOT_FOUND')}};
    return {ok: true, data: data};
  }

  function previewTask(projectId, taskId) {
    var data = (PREVIEW.tasks || []).filter(function (item) {
      return item.task.taskId === taskId && item.project.projectId === projectId;
    })[0];
    if (!data) return {ok: false, error: {code: 'NOT_FOUND', message: T('request.error.REQUEST_NOT_FOUND')}};
    return {ok: true, data: data};
  }

  var previewRequests = {};

  function previewSubmit(payload, type) {
    var id = 'REQ-PREVIEW-' + String(Object.keys(previewRequests).length + 1);
    previewRequests[id] = {type: type, status: 'RECEIVED', taskId: (payload || {}).taskId || ''};
    return {ok: true, data: {requestId: id, status: 'RECEIVED', duplicate: false}};
  }

  function previewStatus(id) {
    if (!previewRequests[id]) return {ok: false, error: {code: 'REQUEST_NOT_FOUND'}};
    return {ok: true, data: {requestId: id, status: 'RECEIVED', taskId: previewRequests[id].taskId}};
  }

  /* ---------------- formatting ---------------- */

  function percentText(value) {
    return value === null || value === undefined ? T('common.none') : Math.round(value) + '%';
  }

  /** Japanese has no plural form; English needs "1 item" next to "2 items". */
  function itemUnit(count) {
    return Number(count) === 1 ? T('common.item') : T('common.items');
  }

  function healthClass(health) {
    if (health === 'GREEN') return 'pill pill-green';
    if (health === 'YELLOW') return 'pill pill-amber';
    if (health === 'RED') return 'pill pill-red';
    return 'pill pill-gray';
  }

  function deadlineClass(item) {
    if (item.deadlineKind === 'overdue') return 'is-overdue';
    if (item.deadlineKind === 'today') return 'is-soon';
    if (item.deadlineKind === 'future' && item.daysRemaining !== null && item.daysRemaining <= 7) return 'is-soon';
    return '';
  }

  function progressBar(percent, label) {
    var value = percent === null || percent === undefined ? 0 : Math.max(0, Math.min(100, percent));
    var track = el('div', {className: 'progress', attrs: {
      role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100',
      'aria-valuenow': String(Math.round(value)), 'aria-label': label || T('dashboard.table.progress')
    }}, [el('div', {className: 'progress-fill', attrs: {style: 'width: ' + value + '%'}})]);
    return track;
  }

  function metaItem(label, value, valueClass) {
    return el('div', {className: 'meta-item'}, [
      el('span', {className: 'meta-label', text: label}),
      el('span', {className: 'meta-value ' + (valueClass || ''), text: unset(value)})
    ]);
  }

  /* ---------------- overview ---------------- */

  function loadPortfolio(query) {
    var token = ++state.requestToken;
    setLoading(true);
    state.query = query || '';
    return api.portfolio({query: state.query}).then(function (result) {
      if (token !== state.requestToken) return;   // a stale response never overwrites a newer one
      setLoading(false);
      if (!result || !result.ok) {
        showOverviewError(result);
        return;
      }
      applyPayload(result.data);
    }).catch(function (error) {
      if (token !== state.requestToken) return;
      setLoading(false);
      // A response-contract failure is reported with its reason; anything else stays generic.
      var contract = error && /^INVALID_RESPONSE/.test(String(error.message || ''));
      showOverviewError(contract ? {error: {message: error.message}} : null);
    });
  }

  function applyPayload(data) {
    // The project list is required: an absent or non-array value is a contract failure that the
    // caller reports, never a portfolio that claims there are no projects.
    if (!data) throw new Error('INVALID_RESPONSE: expected payload for portfolio');
    state.projects = requireArray(data.projects, 'projects');
    state.meta = data.meta || null;
    state.indicators = data.indicators || null;
    state.filterOptions = data.filters || {categories: [], owners: [], statuses: []};
    dom.error.hidden = true;
    dom.list.hidden = false;
    renderSync();
    renderNotices();
    renderKpis();
    renderFilterOptions();
    renderActiveFilters();
    renderProjects();
  }

  function setLoading(loading) {
    dom.loading.hidden = !loading;
    if (loading) {
      dom.list.hidden = true;
      dom.empty.hidden = true;
    }
  }

  function showOverviewError(result) {
    dom.list.hidden = true;
    dom.empty.hidden = true;
    dom.error.hidden = false;
    dom.errorDetail.textContent = result && result.error
      ? I18n.errorMessage(language, result.error)
      : T('dashboard.notice.loadFailedBody');
    dom.resultCount.textContent = T('dashboard.result.unavailable');
    dom.sync.textContent = T('dashboard.sync.unavailable');
  }

  function renderSync() {
    if (!state.meta) return;
    var label = state.meta.publishedAtLabel || T('common.unknown');
    dom.sync.textContent = T('dashboard.sync.label', {label: label}) +
      (state.meta.stale ? T('dashboard.sync.staleSuffix') : '');
  }

  function renderNotices() {
    clear(dom.notices);
    if (!state.meta) return;
    if (state.meta.stale) {
      dom.notices.appendChild(el('div', {className: 'notice notice-warn'}, [
        el('span', {className: 'notice-strong', text: T('dashboard.notice.staleTitle')}),
        el('span', {text: T('dashboard.notice.staleBody', {
          label: state.meta.publishedAtLabel || T('common.unknown'),
          hours: state.meta.ageHours
        })})
      ]));
    }
    if (state.meta.ageHours === null) {
      dom.notices.appendChild(el('div', {className: 'notice notice-info'}, [
        el('span', {text: T('dashboard.notice.noSync')})
      ]));
    }
  }

  function renderKpis() {
    clear(dom.kpis);
    if (!state.indicators) return;
    var items = [
      {label: T('dashboard.kpi.active'), value: state.indicators.activeProjects, risk: false},
      {label: T('dashboard.kpi.atRisk'), value: state.indicators.atRiskProjects, risk: state.indicators.atRiskProjects > 0},
      {label: T('dashboard.kpi.dueWithin7'), value: state.indicators.dueWithin7Days, risk: false},
      {label: T('dashboard.kpi.overdueTasks'), value: state.indicators.overdueTasks, risk: state.indicators.overdueTasks > 0}
    ];
    items.forEach(function (item) {
      dom.kpis.appendChild(el('div', {className: 'kpi' + (item.risk ? ' is-risk' : '')}, [
        el('p', {className: 'kpi-label', text: item.label}),
        el('p', {className: 'kpi-value'}, [
          el('span', {text: String(item.value)}),
          el('span', {className: 'kpi-unit', text: itemUnit(item.value)})
        ])
      ]));
    });
  }

  function renderFilterOptions() {
    var options = state.filterOptions || {categories: [], owners: [], responsibilities: []};
    fillSelect(dom.filterCategory, T('common.all'), options.categories || [], state.filters.category, 'category');
    fillSelect(dom.filterOwner, T('common.all'), options.owners || [], state.filters.owner, 'owner');
    fillResponsibilitySelect(options.responsibilities || []);
  }

  /**
   * Responsibility options are labelled by the stored name and carry the stable ID as the
   * filter value. A retired responsibility keeps its label so historical projects stay
   * filterable; only the label suffix marks it.
   */
  function fillResponsibilitySelect(responsibilities) {
    var select = dom.filterResponsibility;
    clear(select);
    select.appendChild(el('option', {text: T('dashboard.filter.responsibility.all'), attrs: {value: ''}}));
    responsibilities.forEach(function (item) {
      var label = item.retired ? T('dashboard.filter.responsibility.retired', {name: item.name}) : item.name;
      select.appendChild(el('option', {text: label, attrs: {value: item.responsibilityId}}));
    });
    var ids = responsibilities.map(function (item) { return item.responsibilityId; });
    if (ids.indexOf(state.filters.responsibility) < 0) state.filters.responsibility = '';
    select.value = state.filters.responsibility;
  }

  function fillSelect(select, allLabel, values, current, key) {
    clear(select);
    select.appendChild(el('option', {text: allLabel, attrs: {value: ''}}));
    values.forEach(function (value) {
      select.appendChild(el('option', {text: value, attrs: {value: value}}));
    });
    select.value = values.indexOf(current) >= 0 ? current : '';
    state.filters[key] = select.value;
  }

  function isTerminal(project) {
    return !!project.terminal;
  }

  function matchesStatus(project, status) {
    if (!status || status === 'all') return true;
    if (status === 'open') return !isTerminal(project) && project.status !== 'Completed' && project.status !== 'Cancelled';
    if (status === 'active') return project.status === 'Active';
    if (status === 'planned') return project.status === 'Planned';
    if (status === 'hold') return project.status === 'On Hold';
    if (status === 'terminal') return isTerminal(project) || project.status === 'Completed' || project.status === 'Cancelled';
    return true;
  }

  function matchesRisk(project, risk) {
    if (!risk) return true;
    if (risk === 'risk') return project.atRisk;
    return project.health === risk;
  }

  function visibleProjects() {
    var filters = state.filters;
    var list = state.projects.filter(function (project) {
      if (!matchesStatus(project, filters.status)) return false;
      if (filters.responsibility && project.responsibilityId !== filters.responsibility) return false;
      if (filters.category && project.category !== filters.category) return false;
      if (filters.owner && project.ownerName !== filters.owner) return false;
      if (!matchesRisk(project, filters.risk)) return false;
      if (filters.dueSoon) {
        var soon = project.deadlineKind === 'today' ||
          (project.deadlineKind === 'future' && project.daysRemaining !== null && project.daysRemaining <= 7) ||
          project.dueSoonTasks > 0;
        if (!soon) return false;
      }
      return true;
    });
    return sortProjects(list);
  }

  function sortProjects(list) {
    return list.slice().sort(function (a, b) {
      var left = RISK_ORDER[a.health];
      var right = RISK_ORDER[b.health];
      left = left === undefined ? 9 : left;
      right = right === undefined ? 9 : right;
      if (left !== right) return left - right;
      var leftDue = a.committedDeadline || '9999-12-31';
      var rightDue = b.committedDeadline || '9999-12-31';
      if (leftDue !== rightDue) return leftDue < rightDue ? -1 : 1;
      return String(a.projectName).localeCompare(String(b.projectName), 'ja');
    });
  }

  function renderProjects() {
    clear(dom.list);
    var list = visibleProjects();
    var total = state.projects.length;
    dom.list.hidden = list.length === 0;
    dom.empty.hidden = list.length > 0;

    if (!list.length) {
      dom.emptyDetail.textContent = !total
        ? (state.query ? T('dashboard.empty.query') : T('dashboard.empty.none'))
        : T('dashboard.empty.filtered');
    }

    dom.resultCount.textContent = list.length
      ? (total !== list.length
        ? T('dashboard.result.countAll', {count: list.length, total: total})
        : T('dashboard.result.count', {count: list.length}))
      : T('dashboard.result.zero');

    list.forEach(function (project) {
      dom.list.appendChild(projectCard(project));
    });
  }

  function projectCard(project) {
    var cardClass = 'project-card' + (project.health === 'RED' ? ' is-risk'
      : (project.health === 'YELLOW' || project.health === 'UNKNOWN' ? ' is-caution' : ''));
    var card = el('li');
    var button = el('button', {
      className: cardClass,
      attrs: {
        type: 'button',
        'data-project-id': project.projectId,
        'aria-label': T('dashboard.card.detailAria', {name: project.projectName})
      }
    });
    // Health keeps its pill (text + colour); the accent strip stays the project identity.
    withProjectAccent(button, project.projectId);

    button.appendChild(el('div', {className: 'card-head'}, [
      el('div', {}, [
        el('p', {className: 'card-title', text: project.projectName}),
        el('p', {className: 'card-sub', text: [project.responsibilityName || T('dashboard.card.responsibilityUnset'),
          project.category || T('dashboard.card.categoryUnset'), statusText(project.status)].join(' · ')})
      ]),
      el('span', {className: healthClass(project.health), text: project.health ? healthText(project.health) : T('common.none')})
    ]));

    var dl = el('div', {className: 'card-meta'});
    button.appendChild(el('div', {className: 'card-body'}, [
      el('div', {className: 'progress-row'}, [
        progressBar(project.progress, T('dashboard.card.progressAria', {name: project.projectName})),
        el('span', {className: 'progress-value', text: percentText(project.progress)})
      ]),
      dl,
      el('div', {className: 'task-counts'}, [
        el('span', {text: T('dashboard.card.openTasks')}),
        el('strong', {text: String(project.openTasks)}),
        el('span', {text: T('dashboard.card.overdue')}),
        el('strong', {className: project.overdueTasks > 0 ? 'is-overdue' : '', text: String(project.overdueTasks)}),
        el('span', {text: T('dashboard.card.remaining')}),
        el('span', {className: deadlineClass(project), text: deadlineText(project)})
      ])
    ]));

    dl.appendChild(metaItem(T('dashboard.card.owner'), project.ownerName));
    dl.appendChild(metaItem(T('dashboard.card.committedDeadline'), project.committedDeadline));
    dl.appendChild(metaItem(T('dashboard.card.forecastDeadline'), project.forecastDeadline));
    dl.appendChild(metaItem(T('dashboard.card.lastUpdated'), project.lastUpdated));

    card.appendChild(button);
    return card;
  }

  /* ---------------- detail ---------------- */

  function openProject(projectId) {
    var token = ++state.detailToken;
    state.currentProjectId = projectId;
    dom.overview.hidden = true;
    dom.detail.hidden = false;
    // The detail header carries the same identity colour as the card that opened it.
    withProjectAccent(dom.detailHead, projectId);
    dom.detailTitle.textContent = T('common.loading');
    dom.detailSummary.textContent = '';
    clear(dom.detailFacts);
    clear(dom.detailCounts);
    clear(dom.detailNotice);
    clear(dom.detailMilestones);
    clear(dom.detailGroups);
    dom.detailGroups.appendChild(el('div', {className: 'skeleton-list'}, [
      el('div', {className: 'skeleton-card'}),
      el('div', {className: 'skeleton-card'})
    ]));
    dom.detailBack.focus();
    window.scrollTo(0, 0);

    api.project(projectId).then(function (result) {
      if (token !== state.detailToken) return;    // another project was selected meanwhile
      if (!result || !result.ok) {
        clear(dom.detailGroups);
        dom.detailGroups.appendChild(el('div', {className: 'state state-error'}, [
          el('h3', {text: T('dashboard.detail.loadFailed')}),
          el('p', {text: result && result.error ? I18n.errorMessage(language, result.error) : T('dashboard.detail.loadFailedBody')})
        ]));
        return;
      }
      state.detail = result.data;
      state.taskSort = {key: 'due', direction: 1};
      renderDetail();
    }).catch(function () {
      if (token !== state.detailToken) return;
      clear(dom.detailGroups);
      dom.detailGroups.appendChild(el('div', {className: 'state state-error'}, [
        el('h3', {text: T('dashboard.detail.loadFailed')}),
        el('p', {text: T('dashboard.detail.commFailed')})
      ]));
    });
  }

  function closeDetail() {
    state.detailToken++;
    state.currentProjectId = '';
    state.detail = null;
    dom.detail.hidden = true;
    dom.overview.hidden = false;
    dom.search.focus();
  }

  function renderDetail() {
    var detail = state.detail;
    if (!detail) return;
    var project = detail.project;

    dom.detailTitle.textContent = project.projectName;
    dom.detailSummary.textContent = project.summary || T('dashboard.detail.noSummary');
    clear(dom.detailFacts);
    var facts = [
      [T('dashboard.detail.responsibility'), unset(project.responsibilityName)],
      [T('dashboard.detail.owner'), unset(project.ownerName)],
      [T('dashboard.detail.status'), statusText(project.status)],
      [T('dashboard.detail.progress'), percentText(project.progress)],
      [T('dashboard.detail.health'), project.health ? healthText(project.health) : T('common.none')],
      [T('dashboard.detail.deadline'), unset(project.committedDeadline)],
      [T('dashboard.detail.forecast'), unset(project.forecastDeadline)],
      [T('dashboard.detail.remaining'), deadlineText(project)],
      [T('dashboard.detail.updated'), unset(project.lastUpdated)]
    ];
    facts.forEach(function (item, index) {
      dom.detailFacts.appendChild(el('div', {}, [
        el('p', {className: 'fact-label', text: item[0]}),
        el('p', {className: 'fact-value' + (index === 7 ? ' ' + deadlineClass(project) : ''), text: item[1]})
      ]));
    });

    clear(dom.detailCounts);
    var counts = detail.counts || {total: 0, open: 0, done: 0, overdue: 0, blocked: 0};
    [
      [T('dashboard.detail.count.tasks'), counts.total, false],
      [T('dashboard.detail.count.open'), counts.open, false],
      [T('dashboard.detail.count.overdue'), counts.overdue, counts.overdue > 0],
      [T('dashboard.detail.count.blocked'), counts.blocked, false],
      [T('dashboard.detail.count.done'), counts.done, false]
    ].forEach(function (item) {
      dom.detailCounts.appendChild(el('span', {}, [
        el('span', {text: item[0] + ' '}),
        el('strong', {className: item[2] ? 'is-overdue' : '', text: String(item[1])})
      ]));
    });

    clear(dom.detailNotice);
    if (detail.truncated) {
      dom.detailNotice.appendChild(el('div', {className: 'notice notice-info'}, [
        el('span', {text: T('dashboard.detail.truncated', {shown: (detail.tasks || []).length, total: detail.taskTotal})})
      ]));
    }

    renderGroups();
    renderMilestones();
    dom.detailEmpty.hidden = counts.total > 0;
  }

  function tasksFor(subprojectId) {
    return (state.detail.tasks || []).filter(function (task) {
      return (task.subprojectId || '') === subprojectId;
    });
  }

  function sortedTasks(tasks) {
    var key = state.taskSort.key;
    var direction = state.taskSort.direction;
    return tasks.slice().sort(function (a, b) {
      var left, right;
      if (key === 'due') {
        left = a.dueDate || '9999-12-31';
        right = b.dueDate || '9999-12-31';
      } else if (key === 'progress') {
        left = a.progress === null ? -1 : a.progress;
        right = b.progress === null ? -1 : b.progress;
      } else if (key === 'priority') {
        left = PRIORITY_RANK[a.priority] || 0;
        right = PRIORITY_RANK[b.priority] || 0;
        return (left - right) * direction;
      } else {
        left = a[key] || '';
        right = b[key] || '';
      }
      if (left < right) return -1 * direction;
      if (left > right) return 1 * direction;
      return String(a.name).localeCompare(String(b.name), 'ja');
    });
  }

  /**
   * Renders the subproject hierarchy.
   *
   * A nested subproject is indented under its parent. A parent node still shows its own
   * directly assigned tasks; its progress figure includes every descendant task, so the
   * two numbers never contradict each other.
   */
  function renderGroups() {
    var detail = state.detail;
    clear(dom.detailGroups);
    var all = detail.subprojects || [];
    var known = {};
    all.forEach(function (subproject) { known[subproject.subprojectId] = true; });
    var children = {};
    all.forEach(function (subproject) {
      var parent = subproject.parentSubprojectId || '';
      if (!parent || !known[parent]) return;
      if (!children[parent]) children[parent] = [];
      children[parent].push(subproject);
    });

    function emit(subproject) {
      var tasks = tasksFor(subproject.subprojectId);
      var kids = children[subproject.subprojectId] || [];
      if (!tasks.length && !kids.length) return;
      var subtasks = numberOr(subproject.subtreeTotal, tasks.length);
      var meta = [
        subproject.ownerName ? T('dashboard.table.owner') + ' ' + subproject.ownerName : '',
        statusText(subproject.status),
        T('dashboard.table.progress') + ' ' + percentText(subproject.progress),
        subproject.deadline ? T('dashboard.table.deadline') + ' ' + subproject.deadline : '',
        tasks.length ? T('dashboard.count', {count: tasks.length}) : '',
        subtasks > tasks.length ? T('dashboard.detail.subtreeCount', {count: subtasks}) : ''
      ].filter(Boolean).join(' · ');
      dom.detailGroups.appendChild(groupBlock(subproject.name, meta, tasks, subproject.name, subproject));
      kids.forEach(emit);
    }

    // A node is a root when it has no parent, or when its parent is not published.
    all.filter(function (subproject) {
      var parent = subproject.parentSubprojectId || '';
      return !parent || !known[parent];
    }).forEach(emit);

    var ungrouped = (detail.tasks || []).filter(function (task) {
      return !task.subprojectId || !known[task.subprojectId];
    });
    if (ungrouped.length) {
      dom.detailGroups.appendChild(groupBlock(T('dashboard.detail.ungrouped'),
        T('dashboard.count', {count: ungrouped.length}),
        ungrouped, T('dashboard.detail.ungrouped'), null));
    }
  }

  function numberOr(value, fallback) {
    var parsed = Number(value);
    return isFinite(parsed) ? parsed : fallback;
  }

  function groupBlock(title, metaText, tasks, caption, subproject) {
    var level = subproject && numberOr(subproject.level, 1) > 1 ? 2 : 1;
    var details = el('details', {className: 'group' + (level > 1 ? ' group-nested' : ''),
      attrs: {open: true, 'data-level': String(level)}});
    // Every subproject block keeps the hue of the project it belongs to.
    withProjectAccent(details, state.detail && state.detail.project ? state.detail.project.projectId : '');
    details.appendChild(el('summary', {}, [
      el('span', {className: 'group-summary-main'}, [
        el('span', {className: 'group-name', text: title}),
        el('span', {className: 'group-meta', text: metaText})
      ])
    ]));
    var body = el('div', {className: 'group-body'});
    if (tasks.length) body.appendChild(taskTable(sortedTasks(tasks), caption));
    else if (subproject && numberOr(subproject.subtreeTotal, 0) === 0) {
      body.appendChild(el('p', {className: 'group-meta', text: T('dashboard.detail.noTasksBody')}));
    }
    details.appendChild(body);
    return details;
  }

  function taskTable(tasks, caption) {
    var table = el('table', {className: 'task-table'});
    table.appendChild(el('caption', {className: 'visually-hidden', text: caption}));

    var columns = [
      {key: 'name', label: T('dashboard.table.task'), sortKey: 'name'},
      {key: 'ownerName', label: T('dashboard.table.owner'), sortKey: 'ownerName'},
      {key: 'statusText', label: T('dashboard.table.status'), sortKey: 'status'},
      {key: 'priorityText', label: T('dashboard.table.priority'), sortKey: 'priority'},
      {key: 'dueDate', label: T('dashboard.table.deadline'), sortKey: 'due'},
      {key: 'deadlineText', label: T('dashboard.table.remaining'), sortKey: null},
      {key: 'progress', label: T('dashboard.table.progress'), sortKey: 'progress'}
    ];

    var head = el('thead');
    var headRow = el('tr');
    columns.forEach(function (column) {
      var th = el('th', {attrs: {scope: 'col'}});
      if (column.sortKey) {
        var active = state.taskSort.key === column.sortKey;
        var button = el('button', {
          className: 'sort-button',
          attrs: {type: 'button', 'aria-label': T('dashboard.table.sortAria', {label: column.label})},
          text: column.label + (active ? (state.taskSort.direction === 1 ? ' ▲' : ' ▼') : '')
        });
        button.addEventListener('click', function () {
          state.taskSort = {
            key: column.sortKey,
            direction: active && state.taskSort.direction === 1 ? -1 : 1
          };
          renderGroups();
        });
        th.appendChild(button);
      } else {
        th.textContent = column.label;
      }
      headRow.appendChild(th);
    });
    head.appendChild(headRow);
    table.appendChild(head);

    var body = el('tbody');
    tasks.forEach(function (task) {
      var row = el('tr', {attrs: {'data-task-id': task.taskId}});
      // Tasks, including nested ones, reuse the project hue: a 3px row marker, never a new hue.
      withProjectAccent(row, task.projectId);

      var nameCell = el('td', {className: 'cell-primary' + (task.depth ? ' task-nested task-depth-' + Math.min(3, task.depth) : '')}, [
        el('span', {className: 'cell-label', text: T('dashboard.table.task')})
      ]);
      if (task.depth) nameCell.appendChild(el('span', {className: 'tree-mark', attrs: {'aria-hidden': 'true'}, text: '↳'}));
      var nameButton = el('button', {
        className: 'task-name-button',
        attrs: {type: 'button', 'data-open-task': task.taskId,
          'aria-label': T('dashboard.table.openTaskAria', {name: task.name})},
        text: task.name
      });
      nameCell.appendChild(nameButton);
      if (task.container) {
        nameCell.appendChild(el('span', {className: 'container-badge', text: T('dashboard.table.container')}));
      }
      if (task.pendingRequest) {
        nameCell.appendChild(el('span', {className: 'pending-badge', text: T('dashboard.card.pendingRequest')}));
      }
      if (task.reviewState === 'PENDING') {
        nameCell.appendChild(el('span', {className: 'review-badge', text: T('dashboard.card.pendingReview')}));
      } else if (task.reviewState === 'STALE') {
        nameCell.appendChild(el('span', {className: 'review-badge stale', text: T('dashboard.card.staleReview')}));
      }
      row.appendChild(nameCell);

      row.appendChild(cell(T('dashboard.table.owner'), unset(task.ownerName)));
      row.appendChild(cell(T('dashboard.table.status'), statusText(task.status)));
      row.appendChild(cell(T('dashboard.table.priority'), task.priority ? priorityText(task.priority) : T('common.none')));
      row.appendChild(cell(T('dashboard.table.deadline'), unset(task.dueDate)));
      row.appendChild(cell(T('dashboard.table.remaining'), deadlineText(task), 'cell-remaining ' + deadlineClass(task)));

      var progressCell = el('td', {}, [el('span', {className: 'cell-label', text: T('dashboard.table.progress')})]);
      progressCell.appendChild(el('div', {className: 'cell-progress'}, [
        progressBar(task.progress, T('dashboard.card.progressAria', {name: task.name})),
        el('span', {className: 'progress-value', text: percentText(task.progress)})
      ]));
      row.appendChild(progressCell);

      body.appendChild(row);
    });
    table.appendChild(body);
    var wrapper = el('div', {className: 'table-scroll'});
    wrapper.appendChild(table);
    return wrapper;
  }

  function cell(label, value, extraClass) {
    var node = el('td', {className: extraClass || ''}, [
      el('span', {className: 'cell-label', text: label})
    ]);
    node.appendChild(el('span', {text: value === '' || value === null || value === undefined ? T('common.none') : String(value)}));
    return node;
  }

  function renderMilestones() {
    clear(dom.detailMilestones);
    var milestones = state.detail.milestones || [];
    dom.milestonesTitle.hidden = milestones.length === 0;
    milestones.forEach(function (milestone) {
      dom.detailMilestones.appendChild(el('div', {className: 'milestone'}, [
        el('span', {text: milestone.name}),
        el('span', {
          className: milestone.reached ? 'pill pill-green' : 'pill pill-gray',
          text: milestone.reached
            ? T('deadline.done') + ' ' + milestone.actualDate
            : (milestone.targetDate || T('deadline.none'))
        })
      ]));
    });
  }

  /* ---------------- task drawer ---------------- */

  function openTask(projectId, taskId) {
    var token = ++state.drawerToken;
    state.lastFocused = document.activeElement;
    api.task(projectId, taskId).then(function (result) {
      if (token !== state.drawerToken) return;
      if (!result || !result.ok) {
        toast(result && result.error ? I18n.errorMessage(language, result.error) : T('dashboard.drawer.loadFailed'));
        return;
      }
      state.drawerData = result.data;
      renderTaskDrawer(result.data);
      showDrawer();
    }).catch(function () {
      if (token !== state.drawerToken) return;
      toast(T('dashboard.drawer.loadFailed'));
    });
  }

  function renderTaskDrawer(data) {
    var task = data.task;
    dom.drawerTitle.textContent = task.name;
    clear(dom.drawerBody);

    var facts = el('div', {className: 'drawer-facts'});
    [
      [T('dashboard.drawer.taskId'), task.taskId, false],
      [T('dashboard.drawer.project'), task.projectName, false],
      [T('dashboard.drawer.subproject'), task.subprojectName || T('dashboard.drawer.noSubproject'), false],
      [T('dashboard.drawer.parentTask'), task.parentTaskId ? T('dashboard.drawer.nestedTask') : T('common.none'), false],
      [T('dashboard.drawer.owner'), unset(task.ownerName), false],
      [T('dashboard.drawer.status'), statusText(task.status), false],
      [T('dashboard.drawer.reviewState'), task.reviewLabel || T('common.none'), false],
      [T('dashboard.drawer.completedAt'), unset(task.completedAt), false],
      [T('dashboard.drawer.priority'), task.priority ? priorityText(task.priority) : T('common.none'), false],
      [T('dashboard.drawer.start'), unset(task.plannedStart), false],
      [T('dashboard.drawer.deadline'), unset(task.dueDate), false],
      [T('dashboard.drawer.remaining'), deadlineText(task), true],
      [T('dashboard.drawer.progress'), percentText(task.progress), false]
    ].forEach(function (item) {
      facts.appendChild(el('div', {}, [
        el('p', {className: 'fact-label', text: item[0]}),
        el('p', {className: 'fact-value' + (item[2] ? ' ' + deadlineClass(task) : ''), text: item[1]})
      ]));
    });
    dom.drawerBody.appendChild(facts);

    if (task.pendingRequest) {
      dom.drawerBody.appendChild(el('p', {}, [
        el('span', {className: 'pending-badge', text: T('dashboard.card.pendingRequest')})
      ]));
    }

    dom.drawerBody.appendChild(el('div', {}, [
      el('p', {className: 'fact-label', text: T('dashboard.drawer.publicNote')}),
      el('p', {className: 'note', text: task.publicNote || T('dashboard.drawer.noNote')})
    ]));

    dom.drawerBody.appendChild(el('div', {className: 'progress-row'}, [
      progressBar(task.progress, T('dashboard.drawer.progress')),
      el('span', {className: 'progress-value', text: percentText(task.progress)})
    ]));

    dom.drawerBody.appendChild(el('p', {className: 'group-meta', text: T('dashboard.drawer.browseOnly')}));

    dom.drawerBody.appendChild(requestSection(data));
  }

  /* ---------------- worker requests ---------------- */

  /**
   * Unsent request data.
   *
   * Everything the viewer typed lives in `state.draft` (memory only, never a spreadsheet).
   * Rendering reads the draft back, so a language switch, a client validation error or a
   * temporary server error leaves the form exactly as it was.
   */
  function resetDraft(taskId) {
    if (state.draft.taskId !== taskId) {
      state.draft = {taskId: taskId, type: '', fields: {}, lookup: '', receipt: null, statusResult: null};
    }
  }

  function draftValue(key) {
    var value = state.draft.fields[key];
    return value === undefined || value === null ? '' : value;
  }

  function bindDraft(node, key) {
    node.value = draftValue(key);
    var store = function () { state.draft.fields[key] = node.value; };
    node.addEventListener('input', store);
    node.addEventListener('change', store);
    return node;
  }

  function hasUnsavedDraft() {
    return Object.keys(state.draft.fields).some(function (key) {
      return String(state.draft.fields[key] === undefined ? '' : state.draft.fields[key]).trim() !== '';
    });
  }

  function clearDraft() {
    state.draft.type = '';
    state.draft.fields = {};
    state.draft.statusResult = null;
  }

  function configState() {
    var config = state.requestConfig || {};
    if (config.state) return config.state;
    return config.enabled === true ? 'enabled' : 'disabled';
  }

  function clientToken() {
    var token = '';
    try { token = localStorage.getItem(CLIENT_TOKEN_KEY) || ''; } catch (error) { token = ''; }
    if (!token) {
      token = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'tok-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
      try { localStorage.setItem(CLIENT_TOKEN_KEY, token); } catch (error) { /* optional */ }
    }
    return token;
  }

  function requestSection(data) {
    var task = data.task;
    resetDraft(task.taskId);
    var section = el('div', {className: 'request-section'});
    var mode = configState();

    if (mode === 'loading') {
      section.appendChild(el('p', {className: 'request-hint', text: T('request.config.loading')}));
      section.appendChild(disabledButtons());
      return section;
    }
    if (mode === 'error') {
      section.appendChild(el('p', {className: 'request-error', text: T('request.config.error')}));
      return section;
    }
    if (mode === 'disabled') {
      section.appendChild(el('p', {className: 'request-hint', text: T('request.config.disabled')}));
      return section;
    }

    var actions = el('div', {className: 'request-actions'});
    var deadlineButton = el('button', {
      className: 'request-button primary' + (state.draft.type === 'DEADLINE_CHANGE' ? ' is-active' : ''),
      attrs: {type: 'button', 'aria-pressed': state.draft.type === 'DEADLINE_CHANGE' ? 'true' : 'false'},
      text: T('request.action.deadline')
    });
    var completionButton = el('button', {
      className: 'request-button' + (state.draft.type === 'COMPLETION_REPORT' ? ' is-active' : ''),
      attrs: {type: 'button', 'aria-pressed': state.draft.type === 'COMPLETION_REPORT' ? 'true' : 'false'},
      text: T('request.action.completion')
    });
    actions.appendChild(deadlineButton);
    // A container task is completed by its children; the server refuses such a report, so the
    // button is not offered at all and the reason is stated instead.
    var containerTask = task.container === true;
    if (containerTask) completionButton.disabled = true;
    actions.appendChild(completionButton);
    section.appendChild(actions);
    if (containerTask) section.appendChild(el('p', {className: 'request-hint', text: T('request.container')}));

    var area = el('div');
    section.appendChild(area);

    function openDeadline() {
      state.draft.type = 'DEADLINE_CHANGE';
      clear(area);
      area.appendChild(deadlineForm(data, area));
      deadlineButton.className = 'request-button primary is-active';
      completionButton.className = 'request-button';
    }
    function openCompletion() {
      state.draft.type = 'COMPLETION_REPORT';
      clear(area);
      area.appendChild(completionForm(data, area));
      completionButton.className = 'request-button is-active';
      deadlineButton.className = 'request-button primary';
    }
    deadlineButton.addEventListener('click', function () {
      if (state.draft.type === 'DEADLINE_CHANGE') return;
      if (!confirmDiscard()) return;
      state.draft.fields = {};
      openDeadline();
    });
    completionButton.addEventListener('click', function () {
      if (state.draft.type === 'COMPLETION_REPORT') return;
      if (!confirmDiscard()) return;
      state.draft.fields = {};
      openCompletion();
    });

    if (state.draft.type === 'DEADLINE_CHANGE') openDeadline();
    else if (state.draft.type === 'COMPLETION_REPORT') openCompletion();
    else if (state.draft.receipt) {
      area.appendChild(receipt(state.draft.receipt.requestId, state.draft.receipt.status,
        state.draft.receipt.completion));
    }

    section.appendChild(statusLookup());
    return section;
  }

  function confirmDiscard() {
    if (!hasUnsavedDraft()) return true;
    return window.confirm(T('request.draft.discard'));
  }

  function disabledButtons() {
    var wrap = el('div', {className: 'request-actions'});
    wrap.appendChild(el('button', {className: 'request-button primary',
      attrs: {type: 'button', disabled: true}, text: T('request.action.deadline')}));
    wrap.appendChild(el('button', {className: 'request-button',
      attrs: {type: 'button', disabled: true}, text: T('request.action.completion')}));
    return wrap;
  }

  function statusLookup() {
    var statusWrap = el('div', {className: 'request-form'});
    statusWrap.appendChild(el('h3', {text: T('request.status.title')}));
    var statusLabel = el('label', {text: T('request.status.lookup')});
    var statusInput = bindDraft(el('input', {attrs: {type: 'text', placeholder: T('request.status.placeholder'),
      autocomplete: 'off', spellcheck: 'false'}}), 'lookup');
    statusInput.setAttribute('id', 'request-status-lookup');
    statusLabel.setAttribute('for', 'request-status-lookup');
    statusWrap.appendChild(statusLabel);
    statusWrap.appendChild(statusInput);
    var statusButton = el('button', {className: 'request-button', attrs: {type: 'button'}, text: T('request.status.lookup')});
    statusWrap.appendChild(statusButton);
    var statusResult = el('div');
    statusWrap.appendChild(statusResult);
    if (state.draft.statusResult === 'notFound') {
      statusResult.appendChild(el('p', {className: 'request-error', text: T('request.status.notFound')}));
    } else if (state.draft.statusResult) {
      statusResult.appendChild(receipt(state.draft.statusResult.requestId,
        state.draft.statusResult.status, false));
    }
    statusButton.addEventListener('click', function () {
      var id = statusInput.value.trim();
      state.draft.lookup = statusInput.value;
      clear(statusResult);
      if (!id) {
        state.draft.statusResult = 'notFound';
        statusResult.appendChild(el('p', {className: 'request-error', text: T('request.status.notFound')}));
        return;
      }
      api.requestStatus(id).then(function (result) {
        clear(statusResult);
        if (!result || !result.ok) {
          state.draft.statusResult = null;
          statusResult.appendChild(el('p', {className: 'request-error', text: I18n.errorMessage(language, result && result.error)}));
          return;
        }
        state.draft.statusResult = {requestId: result.data.requestId, status: result.data.status};
        statusResult.appendChild(receipt(result.data.requestId, result.data.status, false));
      }).catch(function () {
        clear(statusResult);
        state.draft.statusResult = null;
        statusResult.appendChild(el('p', {className: 'request-error', text: T('request.error.REQUEST_UNEXPECTED')}));
      });
    });
    return statusWrap;
  }

  function readOnlyField(label, value) {
    var wrap = el('div');
    wrap.appendChild(el('label', {text: label}));
    wrap.appendChild(el('div', {className: 'readonly-value', text: value}));
    return wrap;
  }

  function field(labelText, control, id) {
    var wrap = el('div');
    var label = el('label', {text: labelText});
    if (id) {
      control.setAttribute('id', id);
      label.setAttribute('for', id);
    }
    wrap.appendChild(label);
    wrap.appendChild(control);
    return wrap;
  }

  function receipt(requestId, status, completion) {
    var box = el('div', {className: 'request-receipt'});
    box.appendChild(el('h3', {
      text: completion ? T('request.completion.heading') : T('request.confirm.heading')
    }));
    box.appendChild(el('p', {text: completion ? T('request.completion.body') : T('request.confirm.body')}));
    var list = el('dl');
    list.appendChild(el('dt', {text: T('request.confirm.id')}));
    list.appendChild(el('dd', {text: requestId}));
    list.appendChild(el('dt', {text: T('request.confirm.status')}));
    list.appendChild(el('dd', {text: I18n.t(language, 'request.status.' + status)}));
    box.appendChild(list);
    box.appendChild(el('p', {className: 'request-hint', text: T('request.confirm.note')}));
    return box;
  }

  function deadlineForm(data, area) {
    var task = data.task;
    var form = el('div', {className: 'request-form'});
    form.appendChild(el('h3', {text: T('request.action.deadline')}));

    var requested = bindDraft(el('input', {attrs: {type: 'date'}}), 'requestedDate');
    var reason = el('select');
    REASONS.forEach(function (item) {
      reason.appendChild(el('option', {text: T(item.key), attrs: {value: item.value}}));
    });
    // Bind after the options exist, otherwise a restored draft cannot select its value.
    bindDraft(reason, 'reason');
    var explanation = bindDraft(el('textarea', {attrs: {maxlength: '1000'}}), 'explanation');
    var requester = bindDraft(el('input', {attrs: {type: 'text', maxlength: '120', autocomplete: 'off'}}), 'requesterName');

    form.appendChild(readOnlyField(T('request.form.project'), task.projectName || T('common.none')));
    form.appendChild(readOnlyField(T('request.form.task'), task.name || T('common.none')));
    form.appendChild(readOnlyField(T('request.form.owner'), unset(task.ownerName)));
    form.appendChild(readOnlyField(T('request.form.currentDeadline'), unset(task.dueDate)));
    form.appendChild(field(T('request.form.requestedDeadline'), requested, 'request-deadline'));
    form.appendChild(field(T('request.form.reason'), reason, 'request-reason'));
    form.appendChild(field(T('request.form.explanation'), explanation, 'request-explanation'));
    form.appendChild(field(T('request.form.requester'), requester, 'request-requester'));
    form.appendChild(el('p', {className: 'request-hint', text: T('request.form.requiredNote')}));

    var error = el('p', {className: 'request-error'});
    var submit = el('button', {className: 'request-button primary', attrs: {type: 'button'}, text: T('request.form.submit')});
    var cancel = el('button', {className: 'request-button', attrs: {type: 'button'}, text: T('request.form.cancel')});
    var buttons = el('div', {className: 'request-actions'}, [submit, cancel]);
    form.appendChild(buttons);
    form.appendChild(error);
    cancel.addEventListener('click', function () {
      if (!confirmDiscard()) return;
      clearDraft();
      refreshDrawer();
    });

    submit.addEventListener('click', function () {
      clear(error);
      if (!requested.value || !requester.value.trim()) {
        error.textContent = !requested.value ? T('request.error.REQUEST_INVALID_DATE') : T('request.error.REQUEST_REQUESTER_REQUIRED');
        return;
      }
      if (requested.value === task.dueDate) {
        error.textContent = T('request.error.REQUEST_DATE_UNCHANGED');
        return;
      }
      var payload = {
        projectId: task.projectId,
        taskId: task.taskId,
        requestedDate: requested.value,
        reason: reason.value,
        explanation: explanation.value,
        requesterName: requester.value.trim(),
        clientToken: clientToken()
      };
      // Non-blocking: the form closes immediately and the submission controller owns the RPC,
      // the receipt and the failure state. Unconfirmed sends are never reported as success.
      clearDraft();
      closeDrawer();
      toast(T('request.transport.SENDING'));
      startSubmission('DEADLINE_CHANGE', payload, {taskName: task.name}).then(function (entry) {
        if (entry.transport === 'RECEIVED') toast(T('request.transport.RECEIVED') + ' · ' + T('request.activity.received', {id: entry.requestId}));
        else if (entry.transport === 'FAILED') toast(entry.error || T('request.transport.FAILED'));
        else toast(T('request.transport.OUTCOME_UNKNOWN'));
      });
    });

    return form;
  }

  function completionForm(data, area) {
    var task = data.task;
    var form = el('div', {className: 'request-form'});
    form.appendChild(el('h3', {text: T('request.action.completion')}));

    var reporter = bindDraft(el('input', {attrs: {type: 'text', maxlength: '120', autocomplete: 'off'}}), 'reporterName');
    var note = bindDraft(el('textarea', {attrs: {maxlength: '500'}}), 'note');

    form.appendChild(readOnlyField(T('request.form.project'), task.projectName || T('common.none')));
    form.appendChild(readOnlyField(T('request.form.task'), task.name || T('common.none')));
    form.appendChild(readOnlyField(T('request.form.owner'), unset(task.ownerName)));
    form.appendChild(field(T('request.completion.reporter'), reporter, 'request-reporter'));
    form.appendChild(field(T('request.completion.note'), note, 'request-note'));
    form.appendChild(el('p', {className: 'request-hint', text: T('request.form.requiredNote')}));

    var error = el('p', {className: 'request-error'});
    var submit = el('button', {className: 'request-button primary', attrs: {type: 'button'}, text: T('request.completion.button')});
    var cancel = el('button', {className: 'request-button', attrs: {type: 'button'}, text: T('request.form.cancel')});
    form.appendChild(el('div', {className: 'request-actions'}, [submit, cancel]));
    form.appendChild(error);
    cancel.addEventListener('click', function () {
      if (!confirmDiscard()) return;
      clearDraft();
      refreshDrawer();
    });

    submit.addEventListener('click', function () {
      clear(error);
      if (!reporter.value.trim()) { error.textContent = T('request.error.REQUEST_REQUESTER_REQUIRED'); return; }
      var payload = {
        projectId: task.projectId,
        taskId: task.taskId,
        note: note.value,
        reporterName: reporter.value.trim(),
        clientToken: clientToken()
      };
      clearDraft();
      closeDrawer();
      toast(T('request.transport.SENDING'));
      startSubmission('COMPLETION_REPORT', payload, {taskName: task.name}).then(function (entry) {
        if (entry.transport === 'RECEIVED') toast(T('request.transport.RECEIVED') + ' · ' + T('request.activity.received', {id: entry.requestId}));
        else if (entry.transport === 'FAILED') toast(entry.error || T('request.transport.FAILED'));
        else toast(T('request.transport.OUTCOME_UNKNOWN'));
      });
    });

    return form;
  }

  /* ---------------- worker view ---------------- */

  /** Switches between the project portfolio and the worker-centred task list. */
  function setView(next) {
    state.view = next === 'workers' ? 'workers' : 'portfolio';
    dom.overview.hidden = state.view !== 'portfolio';
    // The project detail belongs to the portfolio; returning restores it from state.
    if (dom.detail) dom.detail.hidden = state.view === 'workers' ? true : !state.detail;
    if (dom.workers) dom.workers.hidden = state.view !== 'workers';
    if (dom.viewPortfolio) dom.viewPortfolio.setAttribute('aria-selected', state.view === 'portfolio' ? 'true' : 'false');
    if (dom.viewWorkers) dom.viewWorkers.setAttribute('aria-selected', state.view === 'workers' ? 'true' : 'false');
    if (state.view === 'workers') loadWorkers();
  }

  function workerRequest(overrides) {
    Object.assign(state.worker, overrides || {});
    var w = state.worker;
    return {
      worker: w.worker, responsibilityId: w.responsibilityId, projectId: w.projectId,
      group: w.group, priority: w.priority, overdue: w.overdue === true,
      dueWithin: w.dueWithin ? 7 : 0, query: w.query, offset: w.offset, limit: 20
    };
  }

  /** One bounded, published-data query; a stale answer never replaces a newer filter state. */
  function loadWorkers() {
    var token = ++state.workerToken;
    if (dom.workerError) dom.workerError.hidden = true;
    api.workerTasks(workerRequest()).then(function (result) {
      if (token !== state.workerToken) return;
      if (!result || !result.ok) {
        dom.workerError.hidden = false;
        dom.workerErrorDetail.textContent = I18n.errorMessage(language, result && result.error);
        return;
      }
      // The task list is required; a broken payload is reported instead of shown as "no work".
      try {
        var data = Object.assign({}, result.data);
        data.tasks = requireArray(data.tasks, 'workerTasks.tasks');
        state.workerData = data;
        renderWorkerFilters();
        renderWorkers();
      } catch (error) {
        dom.workerError.hidden = false;
        dom.workerErrorDetail.textContent = String(error && error.message || '');
      }
    }).catch(function () {
      if (token !== state.workerToken) return;
      dom.workerError.hidden = false;
      dom.workerErrorDetail.textContent = T('request.error.REQUEST_UNEXPECTED');
    });
  }

  function workerSelect(select, allLabel, values, current) {
    if (!select) return;
    clear(select);
    select.appendChild(el('option', {text: allLabel, attrs: {value: ''}}));
    values.forEach(function (value) {
      select.appendChild(el('option', {text: value.name, attrs: {value: value.id}}));
    });
    select.value = values.some(function (value) { return value.id === current; }) ? current : '';
  }

  function renderWorkerFilters() {
    var data = state.workerData || {};
    var workers = (data.workers || []).map(function (name) { return {id: name, name: name}; });
    workerSelect(dom.workerWorker, T('dashboard.workers.allWorkers'), workers, state.worker.worker);
    state.worker.worker = dom.workerWorker ? dom.workerWorker.value : state.worker.worker;
    var responsibilities = (data.responsibilities || []).map(function (item) {
      return {id: item.responsibilityId, name: item.retired ? T('dashboard.filter.responsibility.retired', {name: item.name}) : item.name};
    });
    workerSelect(dom.workerResponsibility, T('dashboard.filter.responsibility.all'), responsibilities, state.worker.responsibilityId);
    state.worker.responsibilityId = dom.workerResponsibility ? dom.workerResponsibility.value : state.worker.responsibilityId;
    var projects = (data.projects || []).map(function (item) { return {id: item.projectId, name: item.projectName}; });
    workerSelect(dom.workerProject, T('common.all'), projects, state.worker.projectId);
    state.worker.projectId = dom.workerProject ? dom.workerProject.value : state.worker.projectId;
    var priorities = ['Low', 'Medium', 'High', 'Critical'].map(function (value) {
      return {id: value, name: I18n.label(language, 'priority', value)};
    });
    workerSelect(dom.workerPriority, T('common.all'), priorities, state.worker.priority);
    state.worker.priority = dom.workerPriority ? dom.workerPriority.value : state.worker.priority;
    if (dom.workerGroup) dom.workerGroup.value = state.worker.group;
    if (dom.workerOverdue) dom.workerOverdue.setAttribute('aria-pressed', state.worker.overdue ? 'true' : 'false');
    if (dom.workerDue) dom.workerDue.setAttribute('aria-pressed', state.worker.dueWithin ? 'true' : 'false');
  }

  /** Approval status is displayed separately from the task status, never merged into it. */
  function approvalText(task) {
    if (task.reviewLabel) return task.reviewLabel;
    if (task.pendingRequest) return T('dashboard.drawer.requestPending');
    return T('common.none');
  }

  function workerTaskRow(task) {
    var item = el('li', {className: 'task-item'});
    item.setAttribute('data-worker-task', task.taskId);
    item.setAttribute('data-worker-project', task.projectId);
    withProjectAccent(item, task.projectId);
    var head = el('div', {className: 'task-head'}, [
      el('span', {className: 'task-name', text: task.name}),
      el('span', {className: 'task-status', text: statusText(task.status)})
    ]);
    item.appendChild(head);
    var names = task.assigneeNames || (task.ownerName ? [task.ownerName] : []);
    var meta = el('div', {className: 'task-meta'}, [
      metaItem(T('request.form.project'), task.projectName || T('common.none')),
      metaItem(T('dashboard.workers.assignees'), names.join('、') || T('common.none')),
      metaItem(T('dashboard.table.deadline'), deadlineText(task), deadlineClass(task)),
      metaItem(T('dashboard.table.progress'), percentText(task.progress)),
      metaItem(T('dashboard.workers.approval'), approvalText(task)),
      metaItem(T('dashboard.table.priority'), priorityText(task.priority))
    ]);
    item.appendChild(meta);
    item.appendChild(progressBar(task.progress, task.name));
    var actions = el('div', {className: 'task-actions'});
    actions.appendChild(el('button', {className: 'link-button', attrs: {type: 'button'}, text: T('dashboard.detail.open')}))
      .addEventListener('click', function () { openTask(task.projectId, task.taskId); });
    item.appendChild(actions);
    return item;
  }

  function renderWorkers() {
    if (!dom.workerList) return;
    var data = state.workerData;
    clear(dom.workerList);
    if (!data) return;
    var tasks = data.tasks || [];
    dom.workerEmpty.hidden = tasks.length > 0;
    var from = tasks.length ? data.offset + 1 : 0;
    var to = data.offset + tasks.length;
    dom.workerCount.textContent = T('dashboard.workers.count', {from: from, to: to, total: data.total});
    var totals = data.totals || {};
    dom.workerCount.textContent += ' · ' + T('dashboard.workers.open', {count: totals.open || 0}) +
      ' · ' + T('dashboard.workers.overdueCount', {count: totals.overdue || 0});
    tasks.forEach(function (task) { dom.workerList.appendChild(workerTaskRow(task)); });
    dom.workerPrev.disabled = data.offset <= 0;
    dom.workerNext.disabled = data.offset + tasks.length >= data.total;
  }

  /* ---------------- drawer plumbing ---------------- */

  /** Re-renders the open drawer without losing its scroll position. */
  function refreshDrawer() {
    if (!state.drawerData || !state.drawerOpen) return;
    var scroll = dom.drawerBody.scrollTop;
    renderTaskDrawer(state.drawerData);
    dom.drawerBody.scrollTop = scroll;
  }

  function showDrawer() {
    state.drawerOpen = true;
    dom.drawer.hidden = false;
    dom.backdrop.hidden = false;
    dom.drawerClose.focus();
    document.addEventListener('keydown', handleDrawerKeydown, true);
  }

  function closeDrawer() {
    if (!state.drawerOpen) return;
    state.drawerOpen = false;
    dom.drawer.hidden = true;
    dom.backdrop.hidden = true;
    document.removeEventListener('keydown', handleDrawerKeydown, true);
    if (state.lastFocused && document.contains(state.lastFocused)) state.lastFocused.focus();
    state.lastFocused = null;
  }

  function focusables() {
    return Array.prototype.slice.call(
      dom.drawer.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')
    ).filter(function (node) { return !node.disabled; });
  }

  function handleDrawerKeydown(event) {
    if (event.key === 'Escape' || event.key === 'Esc') {
      event.preventDefault();
      closeDrawer();
      return;
    }
    if (event.key !== 'Tab') return;
    var nodes = focusables();
    if (!nodes.length) return;
    var first = nodes[0];
    var last = nodes[nodes.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }

  /* ---------------- misc ---------------- */

  var toastTimer = null;
  function toast(message) {
    dom.toast.textContent = message;
    dom.toast.hidden = false;
    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () { dom.toast.hidden = true; }, 4000);
  }

  var searchTimer = null;
  function scheduleSearch() {
    if (searchTimer) window.clearTimeout(searchTimer);
    searchTimer = window.setTimeout(function () {
      loadPortfolio(dom.search.value.trim());
    }, SEARCH_DEBOUNCE_MS);
  }

  function syncFilterState() {
    state.filters.status = dom.filterStatus.value;
    state.filters.responsibility = dom.filterResponsibility.value;
    state.filters.category = dom.filterCategory.value;
    state.filters.owner = dom.filterOwner.value;
    state.filters.risk = dom.filterRisk.value;
    renderActiveFilters();
    renderProjects();
  }

  /** Active filters stay visible so a filtered list is never mistaken for the whole set. */
  function renderActiveFilters() {
    clear(dom.activeFilters);
    var filters = state.filters;
    var labels = [];
    if (filters.responsibility) {
      var option = dom.filterResponsibility.options[dom.filterResponsibility.selectedIndex];
      labels.push(T('dashboard.filter.active', {label: T('dashboard.filter.responsibility'),
        value: option ? option.textContent : filters.responsibility}));
    }
    if (filters.category) labels.push(T('dashboard.filter.active', {label: T('dashboard.filter.category'), value: filters.category}));
    if (filters.owner) labels.push(T('dashboard.filter.active', {label: T('dashboard.filter.owner'), value: filters.owner}));
    if (filters.risk) labels.push(T('dashboard.filter.active', {label: T('dashboard.filter.risk'), value: filters.risk}));
    if (filters.dueSoon) labels.push(T('dashboard.filter.active', {label: T('dashboard.filter.dueSoon'), value: T('common.yes')}));
    labels.forEach(function (text) {
      dom.activeFilters.appendChild(el('span', {className: 'filter-tag', text: text}));
    });
  }

  function resetFilters() {
    dom.filterStatus.value = 'open';
    dom.filterResponsibility.value = '';
    dom.filterCategory.value = '';
    dom.filterOwner.value = '';
    dom.filterRisk.value = '';
    dom.filterDue.setAttribute('aria-pressed', 'false');
    state.filters.dueSoon = false;
    syncFilterState();
  }

  /* ---------------- language ---------------- */

  function setLanguage(next) {
    language = I18n.write(next);
    renderAll();
  }

  /**
   * Re-renders every visible label from the current state without re-fetching and without
   * losing the current project, task, filter or scroll position.
   */
  function renderAll() {
    I18n.apply(language, document);
    document.title = I18n.APP_NAME;
    Array.prototype.forEach.call(document.querySelectorAll('.lang-option'), function (button) {
      var active = button.getAttribute('data-lang') === language;
      button.setAttribute('aria-pressed', active ? 'true' : 'false');
      button.className = 'lang-option' + (active ? ' is-active' : '');
    });
    document.title = I18n.APP_NAME;
    renderSync();
    renderNotices();
    renderKpis();
    renderFilterOptions();
    renderActiveFilters();
    renderProjects();
    if (state.detail) renderDetail();
    // The drawer is rebuilt from state, so unsent request data survives the switch.
    refreshDrawer();
    // Worker labels and the receipt list follow the language too, without re-querying.
    if (state.view === 'workers' && state.workerData) { renderWorkerFilters(); renderWorkers(); }
    renderActivity();
  }

  function wireLanguage() {
    Array.prototype.forEach.call(document.querySelectorAll('.lang-option'), function (button) {
      button.addEventListener('click', function () { setLanguage(button.getAttribute('data-lang')); });
    });
    renderLanguageButtons();
  }

  function renderLanguageButtons() {
    Array.prototype.forEach.call(document.querySelectorAll('.lang-option'), function (button) {
      var active = button.getAttribute('data-lang') === language;
      button.setAttribute('aria-pressed', active ? 'true' : 'false');
      button.className = 'lang-option' + (active ? ' is-active' : '');
    });
  }

  function wireEvents() {
    dom.search.addEventListener('input', scheduleSearch);
    dom.search.addEventListener('keydown', function (event) {
